/* ============================================================ DIAG ====== */
/* Dev-only instrumentation for phase verification (kept until phase 7).   */
window.__errors = []; window.__errorCount = 0;
const origConsoleError = console.error.bind(console);
console.error = function (...args) {
  window.__errorCount++; window.__errors.push(args.map(String).join(' '));
  origConsoleError(...args);
};
window.addEventListener('error', (e) => {
  window.__errorCount++; window.__errors.push('window.onerror: ' + (e.message || e.type));
});

/* ============================================================ INPUT ===== */
const heldKeys = new Set();
const airbrakeTapState = [
  { lastL: -1e9, lastR: -1e9, pendingDir: 0 },
  { lastL: -1e9, lastR: -1e9, pendingDir: 0 },
];
// Persistent edge state — Gamepad snapshots from getGamepads() must not be mutated
const padPrev = [
  { lb: false, rb: false, a: false, b: false, x: false, y: false, start: false, back: false, left: false, right: false, up: false, down: false },
  { lb: false, rb: false, a: false, b: false, x: false, y: false, start: false, back: false, left: false, right: false, up: false, down: false },
];
let padsConnected = 0;
let padNames = [];
let padLastActivityMs = 0;
let padSlotMap = [-1, -1]; // player → navigator gamepad index (first connected → P1)
let bridgePads = []; // from local pad-bridge.mjs (Linux js0 fallback when Chrome Gamepad API is empty)
let bridgeOk = false;

function checkAirbrakeDoubleTap(code) {
  const now = performance.now();
  const win = CONFIG.physics.sideshiftWindowMs;
  const m1 = CONFIG.input.p1, m2 = CONFIG.input.p2;
  if (code === m1.brakeL) {
    if (now - airbrakeTapState[0].lastL <= win) { airbrakeTapState[0].pendingDir = -1; airbrakeTapState[0].lastL = -1e9; }
    else airbrakeTapState[0].lastL = now;
  } else if (code === m1.brakeR) {
    if (now - airbrakeTapState[0].lastR <= win) { airbrakeTapState[0].pendingDir = 1; airbrakeTapState[0].lastR = -1e9; }
    else airbrakeTapState[0].lastR = now;
  } else if (code === m2.brakeL) {
    if (now - airbrakeTapState[1].lastL <= win) { airbrakeTapState[1].pendingDir = -1; airbrakeTapState[1].lastL = -1e9; }
    else airbrakeTapState[1].lastL = now;
  } else if (code === m2.brakeR) {
    if (now - airbrakeTapState[1].lastR <= win) { airbrakeTapState[1].pendingDir = 1; airbrakeTapState[1].lastR = -1e9; }
    else airbrakeTapState[1].lastR = now;
  }
}

function padButton(gp, idx) {
  const b = gp.buttons[idx];
  if (!b) return { pressed: false, value: 0 };
  return { pressed: !!b.pressed || b.value > 0.5, value: typeof b.value === 'number' ? b.value : (b.pressed ? 1 : 0) };
}

function isNintendoPad(gp) {
  const id = (gp.id || '').toLowerCase();
  return id.includes('pro controller') || id.includes('nintendo') || id.includes('joy-con')
    || id.includes('057e') || id.includes('switch');
}

/* Collect connected pads in stable order — never assume index === player.
   Prefer browser Gamepad API; if empty, use local pad-bridge (Linux /dev/input/js*). */
function listConnectedPads() {
  const out = [];
  if (navigator.getGamepads) {
    const gps = navigator.getGamepads();
    for (let i = 0; i < gps.length; i++) {
      const gp = gps[i];
      if (gp && gp.connected) out.push(gp);
    }
  }
  if (out.length) {
    out.sort((a, b) => a.index - b.index);
    return out;
  }
  // Bridge pads already look like Gamepad-ish objects
  return bridgePads.filter((g) => g && g.connected);
}

function connectPadBridge() {
  if (typeof WebSocket === 'undefined') return;
  let retryMs = 800;
  const hook = () => {
    let ws;
    try { ws = new WebSocket('ws://127.0.0.1:8018'); }
    catch { setTimeout(hook, retryMs); return; }
    ws.onopen = () => { bridgeOk = true; retryMs = 800; refreshPadSlots(); };
    ws.onclose = () => {
      bridgeOk = false; bridgePads = []; refreshPadSlots();
      setTimeout(hook, retryMs);
      retryMs = Math.min(5000, retryMs * 1.5);
    };
    ws.onerror = () => { try { ws.close(); } catch { /* */ } };
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type !== 'pads' && msg.type !== 'hello') return;
        bridgePads = (msg.pads || []).map((p) => ({
          id: p.id || 'Bridge Pad',
          index: p.index,
          connected: true,
          mapping: '',
          axes: p.axes || [0, 0, 0, 0],
          buttons: (p.buttons || []).map((b) => ({
            pressed: !!(b && b.pressed),
            value: b && typeof b.value === 'number' ? b.value : (b && b.pressed ? 1 : 0),
          })),
        }));
        refreshPadSlots();
      } catch { /* ignore */ }
    };
  };
  hook();
}
connectPadBridge();

function refreshPadSlots() {
  const list = listConnectedPads();
  const prev = padsConnected;
  padsConnected = list.length;
  padNames = list.map((g) => (g.id || 'Pad').split('(')[0].trim().slice(0, 28));
  padSlotMap[0] = list[0] ? list[0].index : -1;
  padSlotMap[1] = list[1] ? list[1].index : -1;
  if (typeof updateControlsHint === 'function') updateControlsHint();
  if (prev !== padsConnected && typeof state !== 'undefined' && state.phase === 'select' && typeof renderSelectUI === 'function') {
    renderSelectUI();
  }
}

function gamepadForPlayer(player) {
  const list = listConnectedPads();
  if (!list.length) return null;
  // Prefer sticky slot map; fall back to ordinal (1st pad → P1)
  const want = padSlotMap[player];
  if (want >= 0) {
    const hit = list.find((g) => g.index === want);
    if (hit) return hit;
  }
  return list[player] || null;
}

function axisLive(gp, idx, dead) {
  const v = gp.axes[idx];
  if (typeof v !== 'number' || Number.isNaN(v)) return 0;
  return Math.abs(v) > dead ? v : 0;
}

/* Normalize any pad (Xbox standard OR raw Switch Pro / Linux joydev) into one shape. */
function decodePad(gp) {
  if (!gp) return null;
  const dead = CONFIG.input.padDeadzone;
  const nintend = isNintendoPad(gp);
  const rawMap = !gp.mapping || gp.mapping !== 'standard';

  let steer = axisLive(gp, 0, dead);
  const stickY = axisLive(gp, 1, dead);

  // D-pad: standard buttons 12–15 + HAT axes (Linux Switch Pro uses hat after sticks)
  let dL = padButton(gp, 14).pressed;
  let dR = padButton(gp, 15).pressed;
  let dU = padButton(gp, 12).pressed;
  let dD = padButton(gp, 13).pressed;
  const axN = gp.axes.length;
  const hatPairs = [[6, 7], [4, 5], [axN - 2, axN - 1]];
  for (const [hxI, hyI] of hatPairs) {
    if (hxI < 0 || hyI >= axN) continue;
    const hx = gp.axes[hxI], hy = gp.axes[hyI];
    if (typeof hx === 'number') { if (hx < -0.5) dL = true; if (hx > 0.5) dR = true; }
    if (typeof hy === 'number') { if (hy < -0.5) dU = true; if (hy > 0.5) dD = true; }
  }
  if (dL) steer = -1;
  if (dR) steer = 1;

  const b0 = padButton(gp, 0); // Xbox A / Switch B
  const b1 = padButton(gp, 1); // Xbox B / Switch A
  const b2 = padButton(gp, 2); // Xbox X / Switch Y
  const b3 = padButton(gp, 3); // Xbox Y / Switch X
  const lSh = padButton(gp, 4); // L / LB — airbrake L
  const rSh = padButton(gp, 5); // R / RB — airbrake R
  const b6 = padButton(gp, 6); // LT / ZL
  const b7 = padButton(gp, 7); // RT / ZR
  let ltVal = b6.value;
  let rtVal = b7.value;
  // Analog triggers only on standard mapping (Xbox LT/RT). Raw Switch Pro uses
  // axes 2–5 as stick/hat resting at 0 — never treat resting 0 as half-pulled!
  if (gp.mapping === 'standard') {
    for (const [ai, which] of [[2, 'lt'], [3, 'lt'], [5, 'rt']]) {
      const v = gp.axes[ai];
      if (typeof v !== 'number') continue;
      let uni = 0;
      if (v >= 0 && v <= 1.01) uni = v;             // already 0..1
      else if (v < -0.2) uni = 0;                   // bipolar rest ≈ -1
      else if (v > -1.01 && v <= 1.01) uni = (v + 1) * 0.5;
      if (which === 'lt') ltVal = Math.max(ltVal, uni);
      else rtVal = Math.max(rtVal, uni);
    }
  }

  // Switch raw: A=btn1, B=btn0, +=btn9. Standard mapping already remaps faces to Xbox order.
  const confirm = (nintend && rawMap) ? (b1.pressed || b0.pressed) : (b0.pressed || b1.pressed);
  const cancel = (nintend && rawMap) ? b0.pressed : b1.pressed;
  const start = padButton(gp, 9).pressed || padButton(gp, 11).pressed;
  const back = padButton(gp, 8).pressed || padButton(gp, 10).pressed;

  // Throttle: RT/ZR, A/B face, OR stick forward (fallback if browser hides triggers)
  const thrust = rtVal > 0.12 || confirm || stickY < -0.35;
  const brakeDown = ltVal > 0.35 || stickY > 0.5;
  const boost = b2.pressed || b3.pressed; // X/Y or Y/X
  const airL = lSh.pressed;
  const airR = rSh.pressed;

  if (Math.abs(steer) > 0.2 || thrust || brakeDown || airL || airR || boost || confirm || start || dL || dR) {
    padLastActivityMs = performance.now();
  }

  return {
    id: gp.id,
    steer,
    thrust,
    brakeDown,
    boost,
    a: confirm,
    b: cancel,
    x: b2.pressed,
    y: b3.pressed,
    start,
    back,
    left: dL || steer < -0.5,
    right: dR || steer > 0.5,
    up: dU || stickY < -0.7,
    down: dD || stickY > 0.7,
    lb: airL,
    rb: airR,
  };
}

const isMobile = (() => {
  if (/(?:\?|&)mobile=1(?:&|$)/.test(location.search || '')) return true;
  try {
    if (matchMedia('(pointer: coarse)').matches) return true;
    if (navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches) return true;
  } catch { /* */ }
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
})();

  left: false,
  right: false,
  boostUntil: 0,
  pointers: new Map(), // pointerId -> { x0,y0,x,y,t0,side }
};
let mobileTouchLayer = null, mobileHintEl = null, touchZoneL = null, touchZoneR = null, touchBoostFlash = null;

function touchSideFromX(clientX) {
  const mid = window.innerWidth * 0.5;
  return clientX < mid ? 'left' : 'right';
}
function refreshTouchAirbrakes() {
  let L = false, R = false;
  for (const p of touchCtl.pointers.values()) {
    if (p.side === 'left') L = true;
    if (p.side === 'right') R = true;
  }
  const m = CONFIG.input.p1;
  if (!touchCtl.left && L && typeof state !== 'undefined' && state.phase === 'racing') checkAirbrakeDoubleTap(m.brakeL);
  if (!touchCtl.right && R && typeof state !== 'undefined' && state.phase === 'racing') checkAirbrakeDoubleTap(m.brakeR);
  touchCtl.left = L;
  touchCtl.right = R;
  if (touchZoneL) touchZoneL.classList.toggle('on', L);
  if (touchZoneR) touchZoneR.classList.toggle('on', R);
}
function fireMobileBoost() {
  touchCtl.boostUntil = performance.now() + CONFIG.input.mobileBoostMs;
  // Meter starts full and counts down over the swipe window (see stepShip)
  if (typeof ships !== 'undefined' && ships[0]) {
    ships[0].boostEnergy = CONFIG.ships.maxEnergy;
  }

function setupMobileTouch() {
  mobileTouchLayer = document.getElementById('mobile-touch-layer');
  mobileHintEl = document.getElementById('mobile-hint');
  touchZoneL = document.getElementById('touch-zone-l');
  touchZoneR = document.getElementById('touch-zone-r');
  touchBoostFlash = document.getElementById('touch-boost-flash');
  if (!isMobile) return;
  if (mobileHintEl) mobileHintEl.style.display = 'block';
  document.body.classList.add('is-mobile');

  const onDown = (e) => {
    // Let UI buttons receive clicks; only capture touches on the game canvas / empty chrome
    if (e.target && e.target.closest && e.target.closest('button,a,[data-action],input')) return;
    if (typeof state !== 'undefined' && state.phase === 'select') return; // menu uses buttons
    e.preventDefault();
    const side = touchSideFromX(e.clientX);
    touchCtl.pointers.set(e.pointerId, {
      x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
      t0: performance.now(), side,
    });
    refreshTouchAirbrakes();
    try { e.target.setPointerCapture?.(e.pointerId); } catch { /* */ }
  };
  const onMove = (e) => {
    const p = touchCtl.pointers.get(e.pointerId);
    if (!p) return;
    e.preventDefault();
    p.x = e.clientX; p.y = e.clientY;
    // Allow finger to slide across midline → reassign airbrake side
    p.side = touchSideFromX(e.clientX);
    refreshTouchAirbrakes();
    // Swipe-up mid-gesture (also checked on release)
    const dy = p.y0 - p.y;
    const dx = Math.abs(p.x - p.x0);
    if (dy >= CONFIG.input.mobileSwipeMinPx && dx < dy * 0.85 && performance.now() - p.t0 <= CONFIG.input.mobileSwipeMaxMs) {
      if (!p.boosted) { p.boosted = true; fireMobileBoost(); }
    }
  };
  const onUp = (e) => {
    const p = touchCtl.pointers.get(e.pointerId);
    if (!p) return;
    e.preventDefault();
    const dy = p.y0 - e.clientY;
    const dx = Math.abs(e.clientX - p.x0);
    const dt = performance.now() - p.t0;
    if (!p.boosted && dy >= CONFIG.input.mobileSwipeMinPx && dx < dy * 0.9 && dt <= CONFIG.input.mobileSwipeMaxMs) {

  window.addEventListener('gesturestart', (e) => e.preventDefault());

function inputFor(player) {
  const m = player === 0 ? CONFIG.input.p1 : CONFIG.input.p2;
  // Mobile 1P: fixed forward thrust, L/R touch = airbrakes, swipe up = boost (no steer keys)
  if (isMobile && player === 0) {
    const boosting = performance.now() < touchCtl.boostUntil;
    return {
      thrust: true,
      brakeDown: false,
      left: false,
      right: false,
      steerAnalog: 0,
      brakeL: touchCtl.left,
      brakeR: touchCtl.right,
      boost: boosting,
    };
  }
  const pad = readPadRaw(player);
  let steerPad = 0, thrustPad = false, brakePad = false, bLPad = false, bRPad = false, boostPad = false;
  if (pad) {
    steerPad = pad.steer;
    thrustPad = pad.thrust;
    brakePad = pad.brakeDown;
    bLPad = pad.lb;
    bRPad = pad.rb;
    boostPad = pad.boost;
    const prev = padPrev[player];
    if (!prev.lb && bLPad) checkAirbrakeDoubleTap(m.brakeL);
    if (!prev.rb && bRPad) checkAirbrakeDoubleTap(m.brakeR);
    prev.lb = bLPad; prev.rb = bRPad;
  } else {
    padPrev[player].lb = false; padPrev[player].rb = false;
  }
  return {
    thrust: heldKeys.has(m.up) || thrustPad,
    brakeDown: heldKeys.has(m.down) || brakePad,
    left: heldKeys.has(m.left),
    right: heldKeys.has(m.right),
    steerAnalog: steerPad,
    brakeL: heldKeys.has(m.brakeL) || bLPad,
    brakeR: heldKeys.has(m.brakeR) || bRPad,
    boost: heldKeys.has(m.boost) || (player === 0 && heldKeys.has('Space')) || boostPad,
  };
}

/* Menu / overlay actions from gamepad rising edges (1st pad → P1, 2nd → P2). */
function pollGamepadMenu() {
  refreshPadSlots();
  const inMenu = state.phase === 'select' || state.phase === 'finished';
  for (let p = 0; p < 2; p++) {
    const pad = readPadRaw(p);
    const prev = padPrev[p];
    if (!pad) {
      prev.a = prev.b = prev.start = prev.back = prev.left = prev.right = prev.up = false;
      continue;
    }
    const edge = (key, now) => { const hit = now && !prev[key]; prev[key] = !!now; return hit; };
    const leftHit = edge('left', pad.left);
    const rightHit = edge('right', pad.right);
    const aHit = edge('a', pad.a);
    const upHit = edge('up', pad.up);
    const startHit = edge('start', pad.start);
    const bHit = edge('b', pad.b);
    const backHit = edge('back', pad.back);
    if (!inMenu) continue;
    if (state.phase === 'select') {
      if (leftHit || rightHit) {
        state.picks[p] = state.picks[p] === 'volt' ? 'arc' : 'volt';
        state.ready[p] = false;
        rebuildShowroomMeshes(); renderSelectUI();
      }
      if (aHit || upHit) {
        state.ready[p] = true;
        if (isGhostMode()) {
          beginCountdown();
        } else {
          if (padsConnected < 2) state.ready[1 - p] = true;
          if (state.ready[0] && state.ready[1]) beginCountdown();
          else renderSelectUI();
        }
      }
      if (startHit) beginCountdown();
    } else if (state.phase === 'finished') {
      if (aHit || startHit) beginCountdown();
      if (bHit || backHit) openShipSelect();
    }
  }
}

const roadMat = new THREE.MeshStandardMaterial({

  roughness: 0.42,
  metalness: 0.25,
