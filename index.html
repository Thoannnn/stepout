function buildShowroom() {
  if (selectScene) return;
  selectScene = new THREE.Scene();
  selectScene.environment = envRT.texture;
  selectScene.add(new THREE.HemisphereLight('#8cb8ff', '#101830', 1.5));
  const dir = new THREE.DirectionalLight('#ffffff', 2.4);
  dir.position.set(4, 8, 6);
  selectScene.add(dir);
  selectCam = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  selectCam.position.set(0, 2.1, 6.4);
  selectCam.lookAt(0, 0, 0);
  rebuildShowroomMeshes();
}

function rebuildShowroomMeshes() {
  if (!selectScene) return;
  for (const m of selectMeshes) {
    selectScene.remove(m);
    m.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  }
  selectMeshes = [
    buildShipMesh(0, state.picks[0]),
    buildShipMesh(1, state.picks[1]),
  ];
  // Pedestal ring under ship in showroom, and add to selectScene!
  for (let p = 0; p < 2; p++) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(2.0, 2.28, 40),
      new THREE.MeshBasicMaterial({ color: CONFIG.ships.colors[p], side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -0.55;
    selectMeshes[p].add(ring);
    selectScene.add(selectMeshes[p]);
  }
}

function makeSelectOverlay() {
  const el = document.createElement('div');
  el.id = 'ship-select-overlay';
  el.style.cssText = 'position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:space-between;' +
                     'background:radial-gradient(circle at 50% 15%, rgba(16,32,62,.35), rgba(4,6,12,.35));pointer-events:none;' +
                     'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf4ff;padding:20px 36px 38px;box-sizing:border-box;';
  document.body.appendChild(el);
  el.addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-action]');
    if (!btn) return;
    const act = btn.dataset.action;
    if (act === 'p1-volt') { state.picks[0] = 'volt'; rebuildShowroomMeshes(); renderSelectUI(); }
    else if (act === 'p1-arc') { state.picks[0] = 'arc'; rebuildShowroomMeshes(); renderSelectUI(); }
    else if (act === 'p2-volt') { state.picks[1] = 'volt'; rebuildShowroomMeshes(); renderSelectUI(); }
    else if (act === 'p2-arc') { state.picks[1] = 'arc'; rebuildShowroomMeshes(); renderSelectUI(); }
    else if (act === 'mode-ghost') setRaceMode('ghost');
    else if (act === 'mode-versus') setRaceMode('versus');
    else if (act === 'clear-ghost') { clearBestGhost(); disposeGhostMesh(); renderSelectUI(); }
    else if (act === 'start-race') beginCountdown();
  });
  return el;
}

function statBarHtml(label, val, col) {

    `<span style="width:68px;opacity:.8;letter-spacing:.5px;text-transform:uppercase">${label}</span>` +

    `<div style="width:${val}%;height:100%;background:${col};box-shadow:0 0 8px ${col}"></div></div>` +
    `<span style="width:28px;text-align:right;font-family:ui-monospace,monospace">${val}</span></div>`;

function setRaceMode(mode) {
  if (isMobile) mode = 'ghost'; // split-screen versus is desktop-only

  state.mode = mode;
  state.ready = [false, false];

        : `First solo run sets the ghost. Finish ${CONFIG.race.totalLaps} laps — that time is saved in this browser.`}</div>` +
      `<div style="font-family:ui-monospace,monospace;font-size:22px;font-weight:900;color:#fff;margin:8px 0 4px">${best ? fmtTime(best.totalMs) : '--:--.--'}</div>` +

/* ---- GHOST (1P vs best lap run, localStorage) --------------------------- */
const GHOST_STRIDE = 12; // t,x,y,z,fx,fy,fz,ux,uy,uz,roll,progress
const ghost = {
  best: null,          // { totalMs, shipType, samples: number[] }
  mesh: null,
  recording: [],
  lastSampleT: -1e9,
  result: null,        // { beat, totalMs, prevBest, newRecord }
  saveError: null,

function isGhostMode() { return state.mode === 'ghost'; }
function ghostFrameCount(samples) {
  return samples && samples.length ? Math.floor(samples.length / GHOST_STRIDE) : 0;
}
function ghostLastT(samples) {
  const n = ghostFrameCount(samples);
  return n > 0 ? samples[(n - 1) * GHOST_STRIDE] : 0;
}
function ghostLastProgress(samples) {
  const n = ghostFrameCount(samples);
  return n > 0 ? samples[(n - 1) * GHOST_STRIDE + 11] : 0;
}
/** A real 3-lap ghost must cover most of the race — reject truncated/test leftovers. */
function isGhostRecordingValid(data) {
  if (!data || !Array.isArray(data.samples) || !data.totalMs) return false;
  const n = ghostFrameCount(data.samples);
  if (n < 90) return false; // ~3s at 30 Hz minimum
  const lastT = ghostLastT(data.samples);
  const lastP = ghostLastProgress(data.samples);
  if (lastT < 12000) return false; // <12s cannot be a full 3-lap run
  if (lastP < CONFIG.race.totalLaps - 0.2) return false;
  if (lastT < data.totalMs * 0.85) return false; // timeline truncated vs finish time
  return true;
}
function roundGhostSamples(samples) {

    const v = samples[i];

    out[i] = k === 0 || k === 11 ? Math.round(v * 10) / 10 : Math.round(v * 1000) / 1000;
  }
  return out;
}
function downsampleGhostSamples(samples, maxFrames) {
  const n = ghostFrameCount(samples);
  if (n <= maxFrames) return samples;
  const step = n / maxFrames;
  const out = [];
  for (let f = 0; f < maxFrames; f++) {
    const idx = Math.min(n - 1, Math.floor(f * step));
    const o = idx * GHOST_STRIDE;
    for (let k = 0; k < GHOST_STRIDE; k++) out.push(samples[o + k]);
  }
  return out;
}
function loadBestGhost() {
  const memory = isGhostRecordingValid(ghost.best) ? ghost.best : null;
  try {
    const raw = localStorage.getItem(CONFIG.race.ghostStorageKey);
    if (!raw) { ghost.best = memory; return memory; }
    const data = JSON.parse(raw);
    if (!isGhostRecordingValid(data)) {
      // Drop truncated leftovers (e.g. old test ghosts) so the next finish can save cleanly
      try { localStorage.removeItem(CONFIG.race.ghostStorageKey); } catch { /* */ }
      ghost.best = memory;
      return memory;
    }
    ghost.best = data;
    return data;
  } catch {
    ghost.best = memory;
    return memory;
  }
}
function saveBestGhost(totalMs, shipType, samples) {
  ghost.saveError = null;
  let packed = roundGhostSamples(samples);
  let data = { totalMs, shipType, samples: packed, savedAt: Date.now(), frames: ghostFrameCount(packed) };
  ghost.best = data; // keep in memory even if disk write fails
  const tryWrite = (payload) => {
    localStorage.setItem(CONFIG.race.ghostStorageKey, JSON.stringify(payload));
    const check = JSON.parse(localStorage.getItem(CONFIG.race.ghostStorageKey) || 'null');
    return check && check.samples && check.samples.length === payload.samples.length;
  };
  try {
    if (!tryWrite(data)) throw new Error('verify mismatch');
  } catch (e1) {
    // Quota / size — downsample and retry
    try {
      packed = roundGhostSamples(downsampleGhostSamples(samples, 1200));
      data = { totalMs, shipType, samples: packed, savedAt: Date.now(), frames: ghostFrameCount(packed) };
      ghost.best = data;
      if (!tryWrite(data)) throw new Error('verify mismatch after downsample');
    } catch (e2) {
      ghost.saveError = String(e2.message || e2);
      console.warn('[ghost] save failed', e2);

}
function clearBestGhost() {
  try { localStorage.removeItem(CONFIG.race.ghostStorageKey); } catch { /* */ }
  ghost.best = null;
  ghost.saveError = null;
}
function disposeGhostMesh() {
  if (!ghost.mesh) return;
  scene.remove(ghost.mesh);
  ghost.mesh.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) m.dispose();
    }
  });
  ghost.mesh = null;
}
function buildGhostMesh(shipType) {
  disposeGhostMesh();
  const mesh = buildShipMesh(1, shipType || 'volt');
  mesh.name = 'ghostShip';
  mesh.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const next = mats.map((m) => {
      const c = m.clone();
      c.transparent = true;
      c.opacity = Math.min(0.72, ((c.opacity ?? 1) * 0.62));
      c.depthWrite = false;
      if ('emissiveIntensity' in c) c.emissiveIntensity = Math.min(0.35, (c.emissiveIntensity || 0) * 0.65);
      return c;
    });
    o.material = Array.isArray(o.material) ? next : next[0];

  mesh.visible = false;
  scene.add(mesh);
  ghost.mesh = mesh;
  return mesh;
}
function shipProgress(ship) {
  const N = CONFIG.track.samples;
  return ship.lap + ((ship.trackIdx % N) / N);
}
function raceElapsedMs(nowMs) {
  if (!(state.raceStartMs > 0)) return 0;
  return Math.max(0, nowMs - state.raceStartMs);
}
function pushGhostPose(t, s) {
  const f = s.forward, u = s.up, p = s.pos;
  ghost.recording.push(
    t, p.x, p.y, p.z,
    f.x, f.y, f.z,
    u.x, u.y, u.z,
    s.visualRoll || 0,
    shipProgress(s)

}
function recordGhostSample(nowMs) {
  if (!isGhostMode() || state.phase !== 'racing') return;
  const s = ships[0];
  if (!s || s.finished) return;
  const t = raceElapsedMs(nowMs);
  if (t <= 0) return;
  const minDt = 1000 / CONFIG.race.ghostSampleHz;
  if (t - ghost.lastSampleT < minDt) return;
  ghost.lastSampleT = t;
  pushGhostPose(t, s);
}
function finalizeGhostRecording(ship, totalMs) {
  // Guarantee a finish pose so playback reaches the end of the race
  pushGhostPose(totalMs, ship);
  ghost.lastSampleT = totalMs;
}
function ghostSampleAt(samples, t) {
  const n = ghostFrameCount(samples);
  if (n <= 0) return null;
  if (t <= samples[0]) return { i0: 0, i1: 0, a: 0 };
  const lastT = samples[(n - 1) * GHOST_STRIDE];
  if (t >= lastT) return { i0: n - 1, i1: n - 1, a: 0 };
  let lo = 0, hi = n - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (samples[mid * GHOST_STRIDE] <= t) lo = mid; else hi = mid;
  }
  const t0 = samples[lo * GHOST_STRIDE], t1 = samples[hi * GHOST_STRIDE];
  const a = t1 > t0 ? (t - t0) / (t1 - t0) : 0;

function readGhostPose(samples, idx, out) {
  const o = idx * GHOST_STRIDE;

  out.pos.set(samples[o + 1], samples[o + 2], samples[o + 3]);
  out.fwd.set(samples[o + 4], samples[o + 5], samples[o + 6]).normalize();

const _gA = { t: 0, pos: new THREE.Vector3(), fwd: new THREE.Vector3(), up: new THREE.Vector3(), roll: 0, progress: 0 };
const _gB = { t: 0, pos: new THREE.Vector3(), fwd: new THREE.Vector3(), up: new THREE.Vector3(), roll: 0, progress: 0 };

  if (!isGhostMode() || !ghost.mesh) return;

    ghost.mesh.visible = false;
    return;
  }
  if (state.phase !== 'racing' && state.phase !== 'finished' && state.phase !== 'countdown') {
    ghost.mesh.visible = false;
    return;

  const t = state.phase === 'countdown' ? 0 : raceElapsedMs(nowMs);
  const hit = ghostSampleAt(best.samples, t);
  if (!hit) { ghost.mesh.visible = false; return; }
  readGhostPose(best.samples, hit.i0, _gA);
  readGhostPose(best.samples, hit.i1, _gB);
  const a = hit.a;
  ghost.mesh.visible = true;
  ghost.mesh.position.lerpVectors(_gA.pos, _gB.pos, a);
  S1.copy(_gA.fwd).lerp(_gB.fwd, a).normalize();
  S2.copy(_gA.up).lerp(_gB.up, a).normalize();

  if (progress >= lastP) return samples[(n - 1) * GHOST_STRIDE];
  let lo = 0, hi = n - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (samples[mid * GHOST_STRIDE + 11] <= progress) lo = mid; else hi = mid;

  const p0 = samples[lo * GHOST_STRIDE + 11], p1 = samples[hi * GHOST_STRIDE + 11];

    newRecord: shouldSave,
    totalMs,
    prevBest: prevBest || null,
    frames: ghostFrameCount(ghost.recording),
    saved: shouldSave && !ghost.saveError,
    saveError: ghost.saveError,

/* ---- GAME STATE + Race Progression + Fixed-Timestep Loop ---------------- */
let ships = [], cameras = [], hudPanels = null, rafId = 0;
const state = {
  phase: 'select',               // 'select' | 'countdown' | 'racing' | 'finished'
  mode: 'ghost',                 // 'ghost' (1P vs best) | 'versus' (2P split) — mobile always ghost
  picks: ['volt', 'arc'],
  ready: [false, false],
  countdownStartMs: 0,
  raceStartMs: 0,
  input: [{}, {}],
  showDebug: false,              // F1 toggles developer telemetry; clean player HUD shown by default!
  fps: 0,
  lastTime: performance.now(),
  accumulator: 0,
  simSteps: 0,
};
if (isMobile) state.mode = 'ghost';
loadBestGhost();

function onMenuKeyDown(code) {
  if (state.phase === 'select') {
    if (code === 'Digit1') { setRaceMode('ghost'); return; }
    if (code === 'Digit2') { setRaceMode('versus'); return; }
    if (code === 'KeyA' || code === 'KeyD') {
      state.picks[0] = state.picks[0] === 'volt' ? 'arc' : 'volt';
      state.ready[0] = false;
      rebuildShowroomMeshes(); renderSelectUI();
    } else if (!isGhostMode() && (code === 'ArrowLeft' || code === 'ArrowRight')) {
      state.picks[1] = state.picks[1] === 'volt' ? 'arc' : 'volt';
      state.ready[1] = false;
      rebuildShowroomMeshes(); renderSelectUI();
    } else if (code === 'Enter') {
      beginCountdown();
    } else if (code === 'KeyW' || code === 'Space' || code === 'ShiftLeft') {
      if (isGhostMode()) {
        state.ready[0] = true;
        if (code === 'Space' || state.ready[0]) beginCountdown();
        else renderSelectUI();
      } else if (state.ready[0] && (state.ready[1] || code === 'Space')) beginCountdown();
      else { state.ready[0] = true; if (state.ready[0] && state.ready[1]) beginCountdown(); else renderSelectUI(); }
    } else if (!isGhostMode() && (code === 'ArrowUp' || code === 'ShiftRight')) {
      state.ready[1] = true;
      if (state.ready[0] && state.ready[1]) beginCountdown(); else renderSelectUI();
    }
  } else if (state.phase === 'finished') {
    if (code === 'Space' || code === 'Enter') beginCountdown();
    else if (code === CONFIG.input.restart) openShipSelect();
  } else if (code === CONFIG.input.restart) {
    openShipSelect();
  }
}

function openShipSelect() {
  state.phase = 'select';
  state.ready = [false, false];
  if (isMobile) state.mode = 'ghost';
  touchCtl.pointers.clear();
  refreshTouchAirbrakes();
  init(state.picks[0], state.picks[1]);
  buildShowroom();
  rebuildShowroomMeshes();
  if (bannerEl) bannerEl.style.display = 'none';
  if (finishEl) finishEl.style.display = 'none';
  renderSelectUI();
  updateMobileChrome();
}

function beginCountdown() {
  if (isMobile) state.mode = 'ghost';
  touchCtl.pointers.clear();
  refreshTouchAirbrakes();
  init(state.picks[0], state.picks[1]);
  state.phase = 'countdown';
  state.countdownStartMs = performance.now();
  state.raceStartMs = 0;
  if (selectEl) selectEl.style.display = 'none';
  if (finishEl) finishEl.style.display = 'none';
  updateMobileChrome();
}

function raceProgressScore(s) {
  const N = CONFIG.track.samples;
  const sIdx = Math.round(CONFIG.track.startLineT * N);
  const rel = ((s.trackIdx - sIdx) % N + N) % N;
  return s.lap * N + rel + (s.player === 0 ? 0.001 : 0);
}

function updateRaceProgress(ship, nowMs) {
  if (state.phase !== 'racing' || ship.finished) return;
  const N = CONFIG.track.samples;
  const sIdx = Math.round(CONFIG.track.startLineT * N);
  const midIdx = (sIdx + Math.round(CONFIG.race.checkpointMidFrac * N)) % N;

  // Detect passing the mid-lap checkpoint
  const distToMid = Math.abs(ship.trackIdx - midIdx);
  if (distToMid < 45) ship.passedMid = true;

  // Detect forward crossing of sIdx
  const prevRel = ((ship.prevTrackIdx - sIdx) % N + N) % N;
  const curRel = ((ship.trackIdx - sIdx) % N + N) % N;
  ship.prevTrackIdx = ship.trackIdx;

  if (prevRel > N * 0.8 && curRel < N * 0.2 && ship.passedMid) {
    const lapTime = nowMs - ship.lapStartMs;
    ship.lastLapMs = lapTime;
    if (!ship.bestLapMs || lapTime < ship.bestLapMs) ship.bestLapMs = lapTime;
    ship.lapStartMs = nowMs;
    ship.passedMid = false;
    ship.lap += 1;
    if (ship.lap >= CONFIG.race.totalLaps) {
      ship.finished = true;
      ship.totalRaceMs = nowMs - state.raceStartMs;
      if (isGhostMode()) {
        ship.finishPlace = 1;
        commitGhostFinish(ship, ship.totalRaceMs);
        state.phase = 'finished';
        renderFinishUI();
      } else {
        const alreadyDone = ships.filter(x => x !== ship && x.finished).length;
        ship.finishPlace = alreadyDone + 1;
        if (ships.every(x => x.finished)) {
          state.phase = 'finished';
          renderFinishUI();
        } else if (!state.finishGraceUntil) {
          state.finishGraceUntil = nowMs + 8000;
        }
      }
    }
  }
}

function disposeShipMesh(s) {
  if (!s) return;
  for (const m of [s.mesh, s.reflMesh, s.puddleMesh, s.windGallery]) {
    if (!m) continue;
    scene.remove(m);
    m.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const mat of mats) {
          // Keep shared soft-particle atlas alive across rematches
          if (mat.map && mat.map === softParticleTex) mat.map = null;
          mat.dispose();
        }
      }
    });
  }
  s.mesh = null; s.reflMesh = null; s.puddleMesh = null; s.windGallery = null;
}

function init(p1Type, p2Type) {
  if (!trackTable.length) buildTrack();
  if (ships && ships.length) for (const s of ships) disposeShipMesh(s);
  disposeGhostMesh();
  if (cameras && cameras.length) {
    for (const rc of cameras) {
      scene.remove(rc.cam);
    }
  }
  const t0 = p1Type || state.picks[0] || 'volt';
  const t1 = p2Type || state.picks[1] || 'arc';
  state.picks = [t0, t1];
  loadBestGhost();
  ghost.recording = [];
  ghost.lastSampleT = -1e9;
  ghost.result = null;

  if (isGhostMode()) {
    ships = [makeShip(0, t0)];
    ships[0].mesh = buildShipMesh(0, t0);
    ships[0].windGallery = buildWindGallery(0, t0);
    ships[0].reflMesh = buildShipReflectionMesh(0);
    ships[0].puddleMesh = null;
    scene.add(ships[0].mesh);
    scene.add(ships[0].reflMesh);
    scene.add(ships[0].windGallery);
    if (ghost.best) buildGhostMesh(ghost.best.shipType || t0);
    cameras = [makeCamera(0)];
  } else {
    ships = [makeShip(0, t0), makeShip(1, t1)];
    ships.forEach((s, i) => {
      s.mesh = buildShipMesh(i, s.type);
      s.windGallery = buildWindGallery(i, s.type);
      s.reflMesh = buildShipReflectionMesh(i);
      s.puddleMesh = null;
      scene.add(s.mesh);
      scene.add(s.reflMesh);
      scene.add(s.windGallery);
    });
    cameras = [makeCamera(0), makeCamera(1)];
  }
  buildTrails();
  buildComposers();
  if (!dividerEl) dividerEl = makeDivider();
  if (!hudPanels) hudPanels = [makeHudPanel(0), makeHudPanel(1)];
  if (!controlsEl) controlsEl = makeControlsHint();
  refreshPadCount();
  if (!selectEl) selectEl = makeSelectOverlay();
  if (!bannerEl) bannerEl = makeBannerOverlay();
  if (!finishEl) finishEl = makeFinishOverlay();
  for (let p = 0; p < ships.length; p++) {
    const s = ships[p], rc = cameras[p], g = trackTable[s.trackIdx];
    rc.offset.copy(g.tangent).multiplyScalar(-CONFIG.camera.backDistance).addScaledVector(g.up, CONFIG.camera.upDistance);
    rc.pos.copy(s.pos).add(rc.offset);
    rc.vel.set(0, 0, 0);
  }
  state.finishGraceUntil = 0;
  state.lastTime = performance.now();
  state.accumulator = 0;
  onResize();
}

function renderShowroomOverlay(nowMs) {
  if (!selectScene || selectMeshes.length < 2) return;
  const w = window.innerWidth, h = window.innerHeight;
  const boxW = Math.min(340, Math.floor(w * 0.24)), boxH = Math.min(200, Math.floor(h * 0.24));
  selectCam.aspect = boxW / Math.max(1, boxH);
  selectCam.updateProjectionMatrix();

  // Render rotating P1 ship above/beside P1 card (left) and P2 ship on right
  const positions = [
    [Math.floor(w * 0.18 - boxW * 0.5 + 90), Math.floor(h * 0.62)],
    [Math.floor(w * 0.82 - boxW * 0.5 - 90), Math.floor(h * 0.62)],
  ];
  for (let p = 0; p < 2; p++) {
    selectMeshes[0].visible = p === 0;
    selectMeshes[1].visible = p === 1;
    selectMeshes[p].rotation.y = nowMs * 0.0014 + p * 0.8;
    selectMeshes[p].rotation.x = Math.sin(nowMs * 0.002 + p) * 0.1;
    renderer.setScissorTest(true);
    renderer.setViewport(positions[p][0], positions[p][1], boxW, boxH);
    renderer.setScissor(positions[p][0], positions[p][1], boxW, boxH);
    renderer.clearDepth();
    renderer.render(selectScene, selectCam);
  }
}

function frame(now) {
  rafId = requestAnimationFrame(frame);
  window.__frameCount = (window.__frameCount || 0) + 1;
  const dtMs = Math.min(250, Math.max(0, now - state.lastTime));
  state.lastTime = now;
  if (dtMs > 0.1) state.fps = state.fps ? state.fps * 0.95 + (1000 / dtMs) * 0.05 : 1000 / dtMs;
  if (window.__updateDebugVisibility) window.__updateDebugVisibility();

  // Countdown progression: 3 - 2 - 1 - GO!
  if (state.phase === 'countdown') {
    const elapsed = now - state.countdownStartMs;
    const beat = CONFIG.race.countdownBeatMs;
    const stepIdx = Math.floor(elapsed / beat);
    if (stepIdx < 3) {
      bannerEl.style.display = 'block';
      bannerEl.textContent = String(3 - stepIdx);
    } else {
      state.phase = 'racing';
      state.raceStartMs = now;
      for (const s of ships) { s.lapStartMs = now; s.passedMid = false; s.prevTrackIdx = s.trackIdx; }
      bannerEl.style.display = 'block';
      bannerEl.textContent = 'GO!';
    }
  } else if (state.phase === 'racing') {
    if (bannerEl && bannerEl.style.display !== 'none') {
      if (now - state.raceStartMs > CONFIG.race.goBannerMs) bannerEl.style.display = 'none';
    }
    if (state.finishGraceUntil && now >= state.finishGraceUntil) {
      for (const s of ships) if (!s.finished) s.finishPlace = 2;
      state.phase = 'finished';
      renderFinishUI();
    }
  }

  readInputs();
  pollGamepadMenu();
  // Lock driving inputs during select / countdown / finished
  if (state.phase !== 'racing') {
    for (let p = 0; p < 2; p++) state.input[p] = { steerX: 0, throttle: false, brakeDown: false, brakeL: false, brakeR: false, boost: false };
  } else {
    for (let p = 0; p < ships.length; p++) if (ships[p].finished) {
      state.input[p] = { steerX: 0, throttle: false, brakeDown: true, brakeL: false, brakeR: false, boost: false };
    }
  }

  state.accumulator += dtMs / 1000;
  const STEP_DT = 1 / CONFIG.physics.fixedHz;
  let steps = 0;
  while (state.accumulator >= STEP_DT && steps < CONFIG.physics.maxCatchupSteps) {
    for (const s of ships) {
      stepShip(s, STEP_DT);
      updateRaceProgress(s, now);
    }
    stepCollisions();
    for (const s of ships) checkRespawn(s);
    state.accumulator -= STEP_DT; state.simSteps++; steps++;
  }
  if (state.phase === 'racing') recordGhostSample(now);

  const alpha = state.accumulator / STEP_DT;
  updateSparks(dtMs / 1000);
  updateLegoPropsVisual(dtMs / 1000, now);
  updateGhostVisual(now);
  const camCount = cameras.length;
  if (state.phase === 'select') {
    for (let p = 0; p < camCount; p++) {
      const idx = Math.floor(((now * 0.04 + p * 900) % CONFIG.track.samples));
      const f = trackTable[idx], lookF = trackTable[(idx + 28) % CONFIG.track.samples];
      const rc = cameras[p];
      rc.cam.position.copy(f.pos).addScaledVector(f.up, 6.5).addScaledVector(f.right, p === 0 ? -4 : 4);
      rc.cam.up.copy(WORLD_UP);
      rc.cam.lookAt(lookF.pos);
    }
  } else {
    for (let p = 0; p < ships.length; p++) {
      S4.lerpVectors(ships[p].prevPos, ships[p].pos, alpha);
      updateCamera(cameras[p], ships[p], dtMs / 1000, S4);
    }
  }

  const solo = isGhostMode();
  const targetRT = mainComposer ? mainComposer.writeBuffer : null;
  const rw = window.innerWidth, rh = window.innerHeight;
  renderer.setRenderTarget(targetRT);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, rw, rh);
  renderer.setClearColor(CONFIG.render.clearColor, 1);
  renderer.clear();
  renderViewport(0, alpha);
  if (!solo) renderViewport(1, alpha);

  if (!solo && targetRT) {
    const band = Math.max(14, Math.round(12 * renderer.getPixelRatio()));
    const midY = Math.floor(rh / 2) - Math.floor(band / 2);
    renderer.setRenderTarget(targetRT);
    renderer.setScissorTest(true);
    renderer.setViewport(0, midY, rw, band);
    renderer.setScissor(0, midY, rw, band);
    renderer.setClearColor(0x000000, 1);
    renderer.clear(true, true, true);
  }

  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, rw, rh);
  if (mainComposer) {
    mainComposer.swapBuffers();
    mainComposer.render();
  }

  if (state.phase === 'select') {
    renderer.setRenderTarget(null);
    renderShowroomOverlay(now);
  }

  const showHud = state.phase !== 'select';
  const wantP2 = showHud && !solo;
  if (hudPanels[0]._vis !== showHud || hudPanels[1]._visP2 !== wantP2) {
    hudPanels[0]._vis = showHud;
    hudPanels[1]._visP2 = wantP2;
    hudPanels[0].style.display = showHud ? 'flex' : 'none';
    hudPanels[1].style.display = wantP2 ? 'flex' : 'none';
    if (dividerEl) dividerEl.style.display = wantP2 ? 'block' : 'none';
  }
  if (showHud && (!state._lastHudAt || now - state._lastHudAt >= 32)) {
    state._lastHudAt = now;
    const fpsStr = state.fps.toFixed(0);
    hudPanels[0].innerHTML = hudText(0, fpsStr, now);
    if (wantP2) hudPanels[1].innerHTML = hudText(1, fpsStr, now);
  }
  updateMobileChrome();
}

function hudText(player, fpsStr, nowMs) {
  const s = ships[player];
  if (!s) return '';
  const other = ships[1 - player];
  const f = trackTable[s.trackIdx];
  const col = CONFIG.ships.colors[player];
  const kmh = Math.round(s.velocity.length() * 10.8);
  const mps = s.velocity.length().toFixed(1);
  const solo = isGhostMode();
  let posStr = '1ST';
  if (!solo && other) {
    const posRank = s.finished ? s.finishPlace : (raceProgressScore(s) >= raceProgressScore(other) ? 1 : 2);
    posStr = posRank === 1 ? '1ST' : '2ND';
  } else if (solo) {
    const d = ghostDeltaMs(s, nowMs);
    if (d == null) posStr = ghost.best ? 'GHOST' : 'SOLO';
    else posStr = d <= 0 ? 'AHEAD' : 'BEHIND';
  }
  const curLapNum = Math.min(CONFIG.race.totalLaps, s.lap + 1);
  const curLapTime = state.phase === 'racing' && !s.finished ? fmtTime(nowMs - s.lapStartMs) : (s.finished ? fmtTime(s.totalRaceMs) : '0:00.00');
  const mobileBoosting = isMobile && player === 0 && nowMs < touchCtl.boostUntil;
  const boostPct = Math.max(0, Math.min(100, s.boostEnergy));
  const boostSecLeft = mobileBoosting ? ((touchCtl.boostUntil - nowMs) / 1000) : 0;
  const raceTime = state.phase === 'racing' ? fmtTime(nowMs - state.raceStartMs) : fmtTime(s.totalRaceMs);

  const badges = [];
  if (mobileBoosting) {
    badges.push(`<span style="background:#19c8ff;color:#040810;padding:3px 10px;border-radius:4px;font-weight:900;letter-spacing:1px;box-shadow:0 0 14px #19c8ffaa">BOOST ${boostSecLeft.toFixed(1)}s</span>`);
  }
  if (solo && ghost.best) {
    const d = ghostDeltaMs(s, nowMs);
    if (d != null && state.phase === 'racing' && !s.finished) {
      const abs = fmtTime(Math.abs(d));
      badges.push(d <= 0
        ? `<span style="background:#22d7a0;color:#04100c;padding:2px 8px;border-radius:4px;font-weight:800">GHOST ${abs}</span>`
        : `<span style="background:#ff4d6d;color:#fff;padding:2px 8px;border-radius:4px;font-weight:800">GHOST +${abs}</span>`);
    } else {
      badges.push(`<span style="background:rgba(154,182,220,.25);color:#dce9ff;padding:2px 8px;border-radius:4px;font-weight:700">BEST ${fmtTime(ghost.best.totalMs)}</span>`);
    }
  }
  if (nowMs < s.perfectLandingUntil) badges.push(`<span style="background:#22d7a0;color:#04100c;padding:2px 8px;border-radius:4px;font-weight:800">PERFECT LANDING +BOOST</span>`);
  else if (nowMs < s.landedFlashUntil) badges.push(`<span style="background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px;font-weight:700">LANDED</span>`);
  if (nowMs < s.sideshiftUntil) badges.push(`<span style="background:#a855f7;color:#fff;padding:2px 8px;border-radius:4px;font-weight:800">SIDESHIFT</span>`);
  if (s.drifting) badges.push(`<span style="background:${col};color:#040810;padding:2px 8px;border-radius:4px;font-weight:800">DRIFT +${Math.round(s.driftStreakSec * 10)}</span>`);
  if (nowMs < s.wallFlashUntil) badges.push(`<span style="background:#ff4d6d;color:#fff;padding:2px 8px;border-radius:4px;font-weight:800">WALL IMPACT</span>`);
  if (nowMs < s.legoSmashUntil) badges.push(`<span style="background:#c91a09;color:#fff;padding:2px 8px;border-radius:4px;font-weight:800">LEGO SMASH +BOOST</span>`);
  if (nowMs < s.legoStudUntil) badges.push(`<span style="background:#f5cd2f;color:#2a1a00;padding:2px 8px;border-radius:4px;font-weight:800">STUD +BOOST</span>`);
  if (s.fellAt > 0) badges.push(`<span style="background:#ffb703;color:#05060a;padding:2px 8px;border-radius:4px;font-weight:800">RESPAWNING...</span>`);

  const devBlock = state.showDebug ? (
    `<div style="margin-top:6px;font-family:ui-monospace,monospace;font-size:11px;color:#a8c5ea;background:rgba(4,7,14,.78);padding:5px 8px;border-radius:5px;">` +
    `spd ${mps} m/s (top ${(s.effTop || 0).toFixed(0)}) · fps ${fpsStr} · ${s.onGround ? 'GND' : 'AIR'} h=${s.height.toFixed(2)}m (comp ${(CONFIG.ships.hoverHeight - s.height).toFixed(2)}m)<br>` +
    `lane ${s.lane.toFixed(1)}m · slip ${(Math.atan2(s.laneVel, Math.max(1, s.forwardVel)) * 180 / Math.PI).toFixed(1)}° · idx ${s.trackIdx}/${CONFIG.track.samples} · bank ${((f?.bank || 0) * 180 / Math.PI).toFixed(1)}°` +
    `</div>`
  ) : '';

  return (
    `<div style="background:rgba(5,9,18,.72);border-left:3px solid ${col};padding:7px 12px;border-radius:6px;min-width:210px;">` +
      `<div style="display:flex;align-items:baseline;gap:10px;">` +
        `<span style="font-weight:900;font-size:18px;color:${col}">${posStr}</span>` +
        `<span style="font-weight:700;font-size:13px;letter-spacing:1px">${solo ? 'YOU' : 'P' + (player + 1)} · ${shipName(player)}</span>` +
        `<span style="margin-left:auto;font-family:ui-monospace,monospace;font-size:13px;font-weight:700">LAP ${curLapNum}/${CONFIG.race.totalLaps}</span>` +
      `</div>` +
      `<div style="display:flex;justify-content:space-between;font-family:ui-monospace,monospace;font-size:12px;color:#b8d0ef;margin-top:3px;">` +
        `<span>LAP ${curLapTime}</span>` +
        `<span>${solo ? 'RACE ' + raceTime : 'BEST ' + fmtTime(s.bestLapMs)}</span>` +
      `</div>` +
      (badges.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11px;">${badges.join('')}</div>` : '') +
      devBlock +
    `</div>` +
    `<div style="background:rgba(5,9,18,.72);border-right:3px solid ${col};padding:7px 12px;border-radius:6px;text-align:right;min-width:165px;">` +
      `<div style="font-family:ui-monospace,monospace;line-height:1;">` +
        `<span style="font-size:24px;font-weight:900;color:#fff">${kmh}</span> <span style="font-size:11px;color:#9ab6dc">KM/H</span>` +
      `</div>` +
      `<div style="margin-top:6px;display:flex;align-items:center;gap:6px;justify-content:flex-end;">` +
        `<span style="font-size:${isMobile ? 11 : 10}px;letter-spacing:1px;color:${mobileBoosting ? '#19c8ff' : '#9ab6dc'};font-weight:${mobileBoosting ? 800 : 400}">BOOST${mobileBoosting ? ' ' + boostSecLeft.toFixed(1) + 's' : ''}</span>` +
        `<div style="width:${isMobile ? 120 : 92}px;height:${isMobile ? 12 : 7}px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden;${mobileBoosting ? 'box-shadow:0 0 10px #19c8ff66;outline:1px solid #19c8ff88' : ''}">` +
          `<div style="width:${boostPct.toFixed(0)}%;height:100%;background:${mobileBoosting ? '#19c8ff' : col};box-shadow:0 0 8px ${mobileBoosting ? '#19c8ff' : col};transition:width .05s linear"></div>` +
        `</div>` +
      `</div>` +
    `</div>`
  );
}
function shipName(p) { return ships[p].type.toUpperCase(); }

function onResize() {
  const w = Math.max(2, window.innerWidth), h = Math.max(4, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.render.maxPixelRatio));
  renderer.setSize(w, h);
  const solo = typeof state !== 'undefined' && isGhostMode();
  const hh = solo ? h : Math.max(2, Math.floor(h / 2));
  if (cameras && cameras.length) {
    for (const rc of cameras) { rc.cam.aspect = w / hh; rc.cam.updateProjectionMatrix(); }
  }
  if (mainComposer) {
    buildComposers();
  }
}
window.addEventListener('resize', onResize);

/* ---- DEV verification helpers (kept until phase 7) ---------------------- */
window.__pump = (n) => { n = n || 1; for (let i = 0; i < n; i++) frame(performance.now() + i * 16.67); };
window.__physicsChecks = () => {
  const out = {};
  const H = CONFIG.ships, P = CONFIG.physics, STEP_DT = 1 / P.fixedHz;
  const childrenBefore = scene.children.length;
  init('volt', 'arc');
  out.noSceneLeakPass = scene.children.length === childrenBefore && trackTable.length === CONFIG.track.samples + 1;

  const put = (pl, o) => { state.input[pl] = Object.assign({ steerX: 0, throttle: false, brakeDown: false, brakeL: false, brakeR: false, boost: false }, o); };
  const pump = n => { for (let i = 0; i < n; i++) { for (const s of ships) stepShip(s, STEP_DT); stepCollisions(); } };
  const setup = (pl, type, vF, idxOverride, laneOverride) => {
    const s = ships[pl];
    const i0 = idxOverride !== undefined ? idxOverride : Math.round(CONFIG.track.startLineT * CONFIG.track.samples);
    const f = trackTable[i0];
    const lane = laneOverride !== undefined ? laneOverride : CONFIG.track.lanes[pl];
    s.type = type;
    s.pos.copy(f.pos).addScaledVector(f.right, lane).addScaledVector(f.up, H.hoverHeight);
    s.prevPos.copy(s.pos);
    s.velocity.copy(f.tangent).multiplyScalar(vF || 0);
    s.heading = 0; s.forward.copy(f.tangent); s.up.copy(f.up);
    if (s.prevTangent) s.prevTangent.copy(f.tangent);
    s.distAlong = f.dist; s.trackIdx = i0; s.onGround = true; s.prevOnGround = true;
    s.boostEnergy = H.maxEnergy * H.energyStartFrac;
    s.lane = lane; s.height = H.hoverHeight; s.visualRoll = 0; s.visualPitch = 0; s.fellAt = 0;
    s.effTop = H.shipTypes[type].topSpeed;
  };

  // 1. Top speed & racing-line boost regen finite (regression test for NaN boost bug!)
  const iStraight = Math.round(0.36 * CONFIG.track.samples);
  setup(0, 'volt', 25, iStraight, -3.5);
  put(1, {}); ships[1].pos.set(0, -999, 0);
  let maxSpd = 0;
  for (let i = 0; i < 420; i++) {
    ships[0].lastPadAt = performance.now() + 99999; // isolate pure engine thrust from boost pads
    const cf = trackTable[ships[0].trackIdx], nf = trackTable[(ships[0].trackIdx + 14) % CONFIG.track.samples];
    const dir = S5.copy(nf.pos).sub(ships[0].pos).normalize();
    const errH = wrapAngle(Math.atan2(dir.dot(cf.right), Math.max(0.2, dir.dot(cf.tangent))) - ships[0].heading);
    const steer = Math.max(-1, Math.min(1, errH * 4));
    put(0, { steerX: steer, throttle: true });
    stepShip(ships[0], STEP_DT);
    maxSpd = Math.max(maxSpd, ships[0].velocity.length());
  }
  out.voltTopSpeed = +maxSpd.toFixed(2);
  out.voltTopSpeedPass = Math.abs(out.voltTopSpeed - H.shipTypes.volt.topSpeed) < 3.5 && ships[0].onGround;
  out.boostFinitePass = Number.isFinite(ships[0].boostEnergy) && ships[0].boostEnergy > H.maxEnergy * H.energyStartFrac;

  // 2. Overspeed bleed back toward topSpeed
  const iFlat = Math.round(0.92 * CONFIG.track.samples);
  setup(1, 'arc', H.shipTypes.arc.topSpeed * (1 + H.boostTopSpeedBonus), iFlat, 0);
  const over = +ships[1].velocity.length().toFixed(2);
  for (let i = 0; i < 180; i++) {
    const cf = trackTable[ships[1].trackIdx], nf = trackTable[(ships[1].trackIdx + 18) % CONFIG.track.samples];
    const dir = S5.copy(nf.pos).sub(ships[1].pos).normalize();
    const errH = wrapAngle(Math.atan2(dir.dot(cf.right), Math.max(0.2, dir.dot(cf.tangent))) - ships[1].heading);
    put(1, { steerX: Math.max(-1, Math.min(1, errH * 4)), throttle: true, boost: false });
    stepShip(ships[1], STEP_DT);
  }
  out.arcOverCapBefore = over; out.arcOverCapAfter = +ships[1].velocity.length().toFixed(2);
  out.topCapPass = over > H.shipTypes.arc.topSpeed + 2 && Math.abs(out.arcOverCapAfter - H.shipTypes.arc.topSpeed) <= 3.0;

  // 3. Identity: ARC grips tighter than VOLT under identical sideways impulse
  setup(0, 'arc', 35, undefined, -4); setup(1, 'volt', 35, undefined, 4);
  put(0, {}); put(1, {});
  for (const pl of [0, 1]) ships[pl].velocity.addScaledVector(trackTable[ships[pl].trackIdx].right, 18);
  pump(45);
  out.arcSlide = +Math.abs(ships[0].velocity.dot(trackTable[ships[0].trackIdx].right)).toFixed(2);
  out.voltSlide = +Math.abs(ships[1].velocity.dot(trackTable[ships[1].trackIdx].right)).toFixed(2);
  out.slidePass = out.arcSlide < out.voltSlide * 0.7;

  // 4. Steer+Airbrake combo (D+E) redirects world velocity sideways much faster than plain steering, while solo airbrake pivots into drift!
  setup(1, 'arc', 40);
  put(1, { steerX: 1, throttle: true }); for (let i = 0; i < 18; i++) stepShip(ships[1], STEP_DT);
  const plainRightVel = ships[1].velocity.dot(trackTable[ships[1].trackIdx].right);
  setup(1, 'arc', 40);
  put(1, { steerX: 1, brakeR: true, throttle: true }); for (let i = 0; i < 18; i++) stepShip(ships[1], STEP_DT);
  const comboRightVel = ships[1].velocity.dot(trackTable[ships[1].trackIdx].right);
  out.airbrakeTurnGain = +(comboRightVel / Math.max(0.1, plainRightVel)).toFixed(2);
  out.airbrakePass = comboRightVel > plainRightVel * 1.6 && Math.abs(ships[1].heading) > 0.35;

  // 4b. Double-tap Sideshift check: double-tap Q-Q / E-E snaps lateral lane offset without rotating heading!
  setup(0, 'volt', 45, undefined, 0);
  ships[0].lastSideshiftAt = -1e9;
  airbrakeTapState[0].pendingDir = 1; // right sideshift
  put(0, { throttle: true });
  for (let i = 0; i < 18; i++) stepShip(ships[0], STEP_DT);
  out.sideshiftLaneDelta = +ships[0].lane.toFixed(2);
  out.sideshiftPass = out.sideshiftLaneDelta > 1.2 && Math.abs(ships[0].heading) < 0.12;

  // 5. Real wall collision + bounce (steep angle into right wall actually hits wall & bounces inward)
  setup(0, 'volt', 40, undefined, 9.5);
  ships[0].velocity.addScaledVector(trackTable[ships[0].trackIdx].right, 18);
  put(0, { throttle: true }); put(1, {});
  let hitWall = false;
  for (let i = 0; i < 40; i++) {
    const prevWf = ships[0].wallFlashUntil;
    stepShip(ships[0], STEP_DT);
    if (ships[0].wallFlashUntil > prevWf) hitWall = true;
  }
  out.wallClampedPass = hitWall && Math.abs(ships[0].lane) <= CONFIG.track.roadHalfWidth - H.wallMargin + 1e-4;

  // 6. Jump gap gravity + airborne state
  const iGap = Math.round((CONFIG.track.jumpGap[0] + 0.012) * CONFIG.track.samples);
  setup(0, 'volt', 55, iGap, 0); put(0, { throttle: true });
  for (let i = 0; i < 20; i++) stepShip(ships[0], STEP_DT);
  out.gapAirbornePass = !ships[0].onGround && ships[0].velocity.y < -1.0;

  // 7. Ship-vs-ship collision separates overlapping ships and exchanges momentum
  setup(0, 'volt', 30, undefined, -0.8); setup(1, 'arc', 30, undefined, 0.8);
  ships[0].velocity.addScaledVector(trackTable[ships[0].trackIdx].right, 8);
  ships[1].velocity.addScaledVector(trackTable[ships[1].trackIdx].right, -8);
  stepCollisions();
  out.collisionPass = ships[0].pos.distanceTo(ships[1].pos) >= H.shipCollisionRadius * 0.95 &&
                      ships[0].velocity.dot(trackTable[ships[0].trackIdx].right) < 0;

  // 8. Core skill check: hairpin + post-hairpin straight (t=0.15 -> 0.42) with airbrakes beats plain steering!
  const runHairpin = (type, useAirbrake) => {
    const N = CONFIG.track.samples, iStart = Math.round(0.15 * N), iEnd = Math.round(0.42 * N);
    setup(0, type, H.shipTypes[type].topSpeed * 0.98, iStart, -2);
    put(1, {}); ships[1].pos.set(0, -999, 0);
    let steps = 0, wallHits = 0;
    while (ships[0].trackIdx < iEnd && steps < 900) {
      const cf = trackTable[ships[0].trackIdx], nf = trackTable[(ships[0].trackIdx + 22) % N];
      const desiredDir = S5.copy(nf.pos).sub(ships[0].pos).normalize();
      const targetH = Math.atan2(desiredDir.dot(cf.right), Math.max(0.2, desiredDir.dot(cf.tangent)));
      const errH = wrapAngle(targetH - ships[0].heading);
      const steer = errH > 0.025 ? 1 : (errH < -0.025 ? -1 : 0);
      const hardCorner = Math.abs(errH) > 0.16;
      put(0, {
        steerX: steer,
        throttle: true,
        brakeL: useAirbrake && hardCorner && steer < 0,
        brakeR: useAirbrake && hardCorner && steer > 0,
      });
      const wf = ships[0].wallFlashUntil;
      stepShip(ships[0], STEP_DT);
      if (ships[0].wallFlashUntil > wf) wallHits++;
      steps++;
    }
    return { timeSec: +(steps * STEP_DT).toFixed(3), wallHits, exitSpeed: +ships[0].velocity.length().toFixed(1) };
  };
  out.hairpinVoltPlain = runHairpin('volt', false);
  out.hairpinVoltAirbrake = runHairpin('volt', true);
  out.hairpinArcPlain = runHairpin('arc', false);
  out.hairpinArcAirbrake = runHairpin('arc', true);
  out.airbrakeFasterInHairpinPass =
    out.hairpinVoltAirbrake.timeSec < out.hairpinVoltPlain.timeSec &&
    out.hairpinArcAirbrake.timeSec < out.hairpinArcPlain.timeSec;

  init('volt', 'arc');
  out.errorCountPass = window.__errorCount === 0;
  return out;
};

window.__scanHalf = (player) => {
  renderer.setRenderTarget(null);
  const gl = renderer.getContext(); if (!gl) return 'noGL';
  const pr = renderer.getPixelRatio(), w = Math.round(window.innerWidth * pr), hh = Math.round((window.innerHeight * pr) / 2);
  const base = player === 0 ? hh : 0, bw = w, bh = hh;
  const px = new Uint8Array(bw * bh * 4);
  gl.readPixels(0, base, bw, bh, gl.RGBA || 6408, gl.UNSIGNED_BYTE, px);
  let lit = 0, sample = null;
  for (let i = 0; i < px.length; i += 163) {
    const r = px[i], g = px[i + 1], b = px[i + 2];
    if (r + g + b > 40) { lit++; if (!sample) sample = [r, g, b]; }
  }
  return { litPixelsSampled: lit, sample };
};

function startGame() {
  openShipSelect();
  if (!rafId) rafId = requestAnimationFrame(frame);
}
window.__wipe = { CONFIG, startGame, openShipSelect, beginCountdown, updateRaceProgress, init, frame, stepShip, stepCollisions, checkRespawn, nearestIndex, inGap, trackTable, get state() { return state; }, get ships() { return ships; }, get cameras() { return cameras; }, get ghost() { return ghost; }, clearBestGhost, loadBestGhost, isMobile, touchCtl };
startGame();

</script>
