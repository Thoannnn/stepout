/* Lookup table — the single source of truth for all physics queries.        */
const trackTable = [];          // {pos,tangent,up,right,bank,dist}; window.trackTable exposed below
let trackCurve = null;
let trackGroup = null;

function disposeGroup(grp) {
  if (!grp) return;
  scene.remove(grp);
  grp.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material && obj.material !== roadMat) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
}

function orientFlatOnTrack(mesh, sample) {
  // PlaneGeometry lies in local XY (+Z normal). Build basis: X = right, Y = tangent, Z = up so quad sits flat on road.
  const m = new THREE.Matrix4().makeBasis(sample.right, sample.tangent, sample.up);
  mesh.quaternion.setFromRotationMatrix(m);
}

function bankAt(t) {
  // Banking is a CLOSED profile: the control keys are fractions of arc length around the loop, so the segment that
  // runs from the last key back to the first crosses t = 1 / t = 0. The old version fell back on an extrapolation
  // past the outer keys (bankAt(0.9995) gave -0.97 rad and bankAt(0) gave +0.93 rad), which rolled the road over by
  // ~109 degrees across the start line — that was literally the "track is not joined just before the start" artifact.
  const keys = CONFIG.track.bankKeys;
  if (!keys.length) return 0;
  const n = keys.length;
  for (let i = 0; i < n - 1; i++) {                                // interior segments
    if (t >= keys[i].t && t <= keys[i+1].t) {
      const a = keys[i], b = keys[i+1], span = b.t === a.t ? 0 : (t - a.t) / (b.t - a.t);
      return a.bank + (b.bank - a.bank) * span;
    }
  }
  const last = keys[n-1], first = keys[0];                        // wrap segment: last key -> first key (+1), across the seam
  const aT = last.t, bT = first.t + 1;
  const tt = t < first.t ? t + 1 : t;                             // pull low-side samples onto the wrapped side
  if (tt >= aT && tt <= bT) {
    const span = bT === aT ? 0 : (tt - aT) / (bT - aT);
    return last.bank + (first.bank - last.bank) * span;
  }
  return first.bank;                                              // single key or exact key: no extrapolation ever
}

function buildTrack() {
  disposeGroup(trackGroup);
  disposeLegoProps();
  trackGroup = new THREE.Group();
  scene.add(trackGroup);
  trackTable.length = 0;

  const T = CONFIG.track, N = T.samples;
  trackCurve = new THREE.CatmullRomCurve3(T.points.map(p => new THREE.Vector3(...p)), true);

  // ---- rotation-minimising frames for a CLOSED loop ---------------------------------------
  const rawTan = new Array(N).fill(null);
  for (let i = 0; i < N; i++) {                                   // central difference, wrapping past the start line
    const a = trackCurve.getPointAt((((i - 1) + N) % N) / N), b = trackCurve.getPointAt(((i + 1) % N) / N);
    rawTan[i] = b.clone().sub(a).normalize();
  }
  const rawUp = new Array(N).fill(null);
  {                                                              // seed: world-up projected off the first tangent
    let u = new THREE.Vector3(0, 1, 0).projectOnPlane(rawTan[0]);
    if (u.lengthSq() < 1e-6) u = new THREE.Vector3(0, 0, 1).projectOnPlane(rawTan[0]);
    rawUp[0] = u.normalize();
  }
  const swing = (up, fromT, toT) => {                            // minimal rotation that carries one tangent onto the next
    const axis = new THREE.Vector3().crossVectors(fromT, toT);
    if (axis.lengthSq() > 1e-10) up.applyAxisAngle(axis.normalize(), Math.min(Math.PI, fromT.angleTo(toT)));
    return up.projectOnPlane(toT).normalize();                   // stays exactly perpendicular to the new tangent
  };
  for (let i = 1; i < N; i++) rawUp[i] = swing(rawUp[i - 1].clone(), rawTan[i - 1], rawTan[i]);

  const carried = swing(rawUp[N - 1].clone(), rawTan[N - 1], rawTan[0]);   // last frame stepped back onto the start line
  let seamTwist = Math.atan2(new THREE.Vector3().crossVectors(carried, rawUp[0]).dot(rawTan[0]), carried.dot(rawUp[0]));
  while (seamTwist > Math.PI) seamTwist -= 2 * Math.PI;
  while (seamTwist < -Math.PI) seamTwist += 2 * Math.PI;

  let dist = 0;
  for (let i = 0; i <= N; i++) {                                   // final lookup table from the corrected frames
    const t = i / N;
    const pos = i === N ? trackTable[0].pos.clone() : trackCurve.getPointAt(t);   // closing sample == start line, exactly
    const tan = rawTan[i % N].clone();
    const bank = bankAt(i === N ? 0 : t);
    const baseUp = (i === N) ? carried : rawUp[i % N];
    const up = baseUp.clone()
      .applyAxisAngle(tan, seamTwist * (i / N))                    // untwist spread over the whole loop, never on one quad
      .applyAxisAngle(tan, bank)                                   // banking last keeps handedness consistent everywhere
      .projectOnPlane(tan).normalize();                            // re-orthogonalise after the two rolls
    const right = new THREE.Vector3().crossVectors(tan, up).normalize();       // right = tangent × up
    if (i > 0) dist += trackTable[i-1].pos.distanceTo(pos);
    trackTable.push({ pos, tangent: tan, up, right, bank, dist });
  }

  window.trackTable = trackTable;
  window.__seamTwist = seamTwist;

  // Swept road + walls with SHARED smooth vertex normals along the ribbon.
  const hw = T.roadHalfWidth, wallH = T.wallHeight;
  const inGapT = (t) => t >= T.jumpGap[0] && t <= T.jumpGap[1];

  // Per-sample curvature (rad/m) — drives road + rail color on tight bends
  const curv = new Float32Array(N + 1);
  for (let i = 0; i < N; i++) {
    const a = trackTable[i], b = trackTable[i + 1];
    const seg = Math.max(0.05, a.pos.distanceTo(b.pos));
    curv[i] = a.tangent.angleTo(b.tangent) / seg;
  }
  curv[N] = curv[0];
  const tightK = T.railTightCurvature;
  function tightBlend(i) {
    // Smoothstep so medium bends tint and hairpins go fully amber
    const x = Math.min(1, Math.max(0, curv[i] / tightK));
    return x * x * (3 - 2 * x);
  }

  const rPos = new Float32Array((N + 1) * 2 * 3);
  const rNrm = new Float32Array((N + 1) * 2 * 3);
  const rUvs = new Float32Array((N + 1) * 2 * 2);
  const rCol = new Float32Array((N + 1) * 2 * 3);
  const rIdx = [];
  const roadOpen = new THREE.Color(T.roadOpen);
  const roadTight = new THREE.Color(T.roadTight);
  const roadTint = new THREE.Color();
  for (let i = 0; i <= N; i++) {
    const a = trackTable[i];
    const lx = a.pos.x - a.right.x * hw, ly = a.pos.y - a.right.y * hw, lz = a.pos.z - a.right.z * hw;
    const rx = a.pos.x + a.right.x * hw, ry = a.pos.y + a.right.y * hw, rz = a.pos.z + a.right.z * hw;
    const vBase = i * 6;
    rPos[vBase] = lx; rPos[vBase + 1] = ly; rPos[vBase + 2] = lz;
    rPos[vBase + 3] = rx; rPos[vBase + 4] = ry; rPos[vBase + 5] = rz;
    rNrm[vBase] = a.up.x; rNrm[vBase + 1] = a.up.y; rNrm[vBase + 2] = a.up.z;
    rNrm[vBase + 3] = a.up.x; rNrm[vBase + 4] = a.up.y; rNrm[vBase + 5] = a.up.z;
    const uBase = i * 4;
    rUvs[uBase] = 0; rUvs[uBase + 1] = a.dist * 0.05;
    rUvs[uBase + 2] = 1; rUvs[uBase + 3] = a.dist * 0.05;
    roadTint.copy(roadOpen).lerp(roadTight, tightBlend(i));
    const cBase = i * 6;
    rCol[cBase] = rCol[cBase + 3] = roadTint.r;
    rCol[cBase + 1] = rCol[cBase + 4] = roadTint.g;
    rCol[cBase + 2] = rCol[cBase + 5] = roadTint.b;
  }
  for (let i = 0; i < N; i++) {
    if (inGapT(i / N) || inGapT((i + 1) / N)) continue;
    const v0 = i * 2, v1 = v0 + 1, v2 = v0 + 2, v3 = v0 + 3;
    rIdx.push(v0, v1, v2, v1, v3, v2);
  }
  const roadGeo = new THREE.BufferGeometry();
  roadGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
  roadGeo.setAttribute('normal', new THREE.BufferAttribute(rNrm, 3));
  roadGeo.setAttribute('uv', new THREE.BufferAttribute(rUvs, 2));
  roadGeo.setAttribute('color', new THREE.BufferAttribute(rCol, 3));
  roadGeo.setIndex(rIdx);
  // Clone asphalt: brighten the map so warm vertex tints stay readable (dark slate map was crushing amber to mud)
  const roadMatCurved = roadMat.clone();
  roadMatCurved.vertexColors = true;
  roadMatCurved.color.set('#ffffff');
  roadMatCurved.map = roadMat.map.clone();
  roadMatCurved.map.colorSpace = THREE.SRGBColorSpace;
  // Bake a lighter asphalt atlas so open=cool slate, tight=amber still pops through the map multiply
  {
    const src = document.createElement('canvas');
    src.width = 256; src.height = 256;
    const img = roadMat.map.image;
    const ctx = src.getContext('2d');
    if (img) {
      ctx.drawImage(img, 0, 0);
      const id = ctx.getImageData(0, 0, 256, 256);
      const d = id.data;
      for (let p = 0; p < d.length; p += 4) {
        // Lift midtones ~1.55× so vertex amber isn't crushed
        d[p] = Math.min(255, d[p] * 1.55 + 18);
        d[p + 1] = Math.min(255, d[p + 1] * 1.55 + 14);
        d[p + 2] = Math.min(255, d[p + 2] * 1.45 + 10);
      }
      ctx.putImageData(id, 0, 0);
    }
    roadMatCurved.map.image = src;
    roadMatCurved.map.needsUpdate = true;
  }
  const roadMesh = new THREE.Mesh(roadGeo, roadMatCurved);
  roadMesh.name = 'road';
  trackGroup.add(roadMesh);

  // Bright amber center ribbon on tight bends — unmistakable even with fog/bloom
  {
    const bandPos = [], bandCol = [], bandInd = [];
    let bi = 0;
    const amber = new THREE.Color('#ff9a2a').multiplyScalar(1.6);
    const cool = new THREE.Color('#1a2438');
    const bcA = new THREE.Color(), bcB = new THREE.Color();
    const halfBand = 2.4;
    for (let i = 0; i < N; i++) {
      if (inGapT(i / N) || inGapT((i + 1) / N)) continue;
      const blendA = tightBlend(i), blendB = tightBlend(i + 1);
      if (blendA < 0.2 && blendB < 0.2) continue;
      const a = trackTable[i], b = trackTable[i + 1];
      bcA.copy(cool).lerp(amber, blendA);
      bcB.copy(cool).lerp(amber, blendB);
      const A0 = a.pos.clone().addScaledVector(a.right, -halfBand).addScaledVector(a.up, 0.05);
      const A1 = a.pos.clone().addScaledVector(a.right, halfBand).addScaledVector(a.up, 0.05);
      const B0 = b.pos.clone().addScaledVector(b.right, -halfBand).addScaledVector(b.up, 0.05);
      const B1 = b.pos.clone().addScaledVector(b.right, halfBand).addScaledVector(b.up, 0.05);
      bandPos.push(A0.x, A0.y, A0.z, A1.x, A1.y, A1.z, B0.x, B0.y, B0.z, B1.x, B1.y, B1.z);
      bandCol.push(bcA.r, bcA.g, bcA.b, bcA.r, bcA.g, bcA.b, bcB.r, bcB.g, bcB.b, bcB.r, bcB.g, bcB.b);
      bandInd.push(bi, bi + 1, bi + 2, bi + 1, bi + 3, bi + 2);
      bi += 4;
    }
    if (bandPos.length) {
      const bg = new THREE.BufferGeometry();
      bg.setAttribute('position', new THREE.Float32BufferAttribute(bandPos, 3));
      bg.setAttribute('color', new THREE.Float32BufferAttribute(bandCol, 3));
      bg.setIndex(bandInd);
      trackGroup.add(new THREE.Mesh(bg, new THREE.MeshBasicMaterial({
        vertexColors: true, transparent: true, opacity: 0.82, depthWrite: false, side: THREE.DoubleSide,
      })));
    }
  }

  // Low side walls extruded along local frame up + bright NEON border rails (cyan left, magenta right)
  const wallMat = new THREE.MeshStandardMaterial({
    color: '#1b2b48', roughness: 0.35, metalness: 0.55,
    emissive: '#0e1b36', emissiveIntensity: 0.9, side: THREE.DoubleSide,
  });
  const wGeo = new THREE.BufferGeometry();
  let wi2 = 0;
  const wPos = [], wInd = [];
  for (let i = 0; i < N; i++) {
    if (inGapT(i / N) || inGapT((i + 1) / N)) continue;
    const a = trackTable[i], b = trackTable[i + 1];
    for (const side of [1, -1]) {
      const A0 = a.pos.clone().addScaledVector(a.right, side * hw);
      const B0 = b.pos.clone().addScaledVector(b.right, side * hw);
      const A1 = A0.clone().addScaledVector(a.up, wallH);
      const B1 = B0.clone().addScaledVector(b.up, wallH);
      wPos.push(A0.x, A0.y, A0.z, A1.x, A1.y, A1.z, B0.x, B0.y, B0.z, B1.x, B1.y, B1.z);
      if (side > 0) wInd.push(wi2, wi2 + 2, wi2 + 1, wi2 + 1, wi2 + 2, wi2 + 3);
      else          wInd.push(wi2, wi2 + 1, wi2 + 2, wi2 + 1, wi2 + 3, wi2 + 2);
      wi2 += 4;
    }
  }
  wGeo.setAttribute('position', new THREE.Float32BufferAttribute(wPos, 3));
  wGeo.setIndex(wInd);
  wGeo.computeVertexNormals();
  trackGroup.add(new THREE.Mesh(wGeo, wallMat));

  const colOpenL = new THREE.Color(T.railOpenL).multiplyScalar(1.45);
  const colOpenR = new THREE.Color(T.railOpenR).multiplyScalar(1.45);
  const colTight = new THREE.Color(T.railTight).multiplyScalar(1.7);
  function railColorAt(i, side, out) {
    const open = side < 0 ? colOpenL : colOpenR;
    return out.copy(open).lerp(colTight, tightBlend(i));
  }
  const cA = new THREE.Color(), cB = new THREE.Color();

  // Neon border ribbons — open cyan/magenta, tighter curves → bright amber
  for (const side of [-1, 1]) {
    const railPos = [], railCol = [], railInd = [];
    let ri = 0;
    for (let i = 0; i < N; i++) {
      if (inGapT(i / N) || inGapT((i + 1) / N)) continue;
      const a = trackTable[i], b = trackTable[i + 1];
      railColorAt(i, side, cA);
      railColorAt(i + 1, side, cB);
      for (const [hOff, rInward, thick] of [[wallH, 0.0, 0.28], [0.06, -side * 0.22, 0.34]]) {
        const pA0 = a.pos.clone().addScaledVector(a.right, side * hw + rInward).addScaledVector(a.up, hOff);
        const pA1 = pA0.clone().addScaledVector(a.right, -side * thick);
        const pB0 = b.pos.clone().addScaledVector(b.right, side * hw + rInward).addScaledVector(b.up, hOff);
        const pB1 = pB0.clone().addScaledVector(b.right, -side * thick);
        railPos.push(pA0.x, pA0.y, pA0.z, pA1.x, pA1.y, pA1.z, pB0.x, pB0.y, pB0.z, pB1.x, pB1.y, pB1.z);
        railCol.push(cA.r, cA.g, cA.b, cA.r, cA.g, cA.b, cB.r, cB.g, cB.b, cB.r, cB.g, cB.b);
        railInd.push(ri, ri + 1, ri + 2, ri + 1, ri + 3, ri + 2);
        ri += 4;
      }
    }
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.Float32BufferAttribute(railPos, 3));
    rg.setAttribute('color', new THREE.Float32BufferAttribute(railCol, 3));
    rg.setIndex(railInd);
    const rm = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
    trackGroup.add(new THREE.Mesh(rg, rm));
  }

  // Flat launch marker on the ramp (no vertical end-cap walls — those blocked the jump)
  const rampIdx = Math.max(0, Math.floor(T.jumpGap[0] * N) - 1);
  const rf = trackTable[rampIdx];
  const rampBar = new THREE.Mesh(
    new THREE.PlaneGeometry(hw * 2, 1.4),
    new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffbe0b').multiplyScalar(1.4), side: THREE.DoubleSide })
  );
  orientFlatOnTrack(rampBar, rf);
  rampBar.position.copy(rf.pos).addScaledVector(rf.up, 0.06);
  trackGroup.add(rampBar);

  // Start/finish checkered neon banner + glowing chevron boost pads
  const sIdx = Math.round(T.startLineT * N);
  const sl = new THREE.Mesh(
    new THREE.PlaneGeometry(hw * 2 - 0.6, 1.8),
    new THREE.MeshBasicMaterial({ color: '#c8ecff', side: THREE.DoubleSide })
  );
  sl.position.copy(trackTable[sIdx].pos).addScaledVector(trackTable[sIdx].up, 0.045);
  orientFlatOnTrack(sl, trackTable[sIdx]);
  trackGroup.add(sl);

  const chevTex = makeChevronTexture('#28ffc8');
  for (const bt of T.boostPadsT) {
    const i = Math.round(bt * N); if (inGapT(bt)) continue;
    const s2 = trackTable[i];
    const pad = new THREE.Mesh(
      new THREE.PlaneGeometry(T.padAcross, T.padLenAlong),
      new THREE.MeshBasicMaterial({
        map: chevTex,
        color: new THREE.Color('#40ffd0').multiplyScalar(1.8),
        transparent: true,
        side: THREE.DoubleSide,
      })
    );
    orientFlatOnTrack(pad, s2);
    pad.position.copy(s2.pos).addScaledVector(s2.up, 0.055);
    trackGroup.add(pad);
  }

  // Debug frame view (F2): axes every `frameDebugStep` samples — OFF by default for normal players
  const dg = new THREE.Group();
  for (let i = 0; i < trackTable.length - 1; i += CONFIG.track.frameDebugStep) {
    const f = trackTable[i];
    for (const [col, vec] of [['#ff5c8a', f.tangent], ['#63e7ff', f.up], ['#ffd24d', f.right]]) {
      const g = new THREE.BufferGeometry().setFromPoints([f.pos.clone(), f.pos.clone().addScaledVector(vec, 3)]);
      dg.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: col })));
    }
  }
  if (window.__debugGroupVisible === undefined) window.__debugGroupVisible = false;
  dg.visible = !!window.__debugGroupVisible;
  trackGroup.add(dg);
  window.__updateDebugVisibility = () => { dg.visible = !!window.__debugGroupVisible; };

  // Soft dusk ground disc (no wire grid — fog + golden hour need a calm horizon bed)
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(CONFIG.render.gridSize * 0.55, 48),
    new THREE.MeshBasicMaterial({ color: '#2a1a22', fog: true, depthWrite: false })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = CONFIG.render.gridY;
  ground.renderOrder = -5;
  trackGroup.add(ground);

  buildLegoProps(); // interactive LEGO crates / towers / studs on the racing line
}

/* ============================================================ SHIP PHYSICS == */
/* Zero-allocation scratch vectors & quaternions reused in the 120 Hz loop.  */
const S1 = new THREE.Vector3(), S2 = new THREE.Vector3(), S3 = new THREE.Vector3();
const S4 = new THREE.Vector3(), S5 = new THREE.Vector3(), WORLD_UP = new THREE.Vector3(0, 1, 0);
const Q1 = new THREE.Quaternion(), Q2 = new THREE.Quaternion(), M4 = new THREE.Matrix4();

function spawnPose(player) {
  const i = Math.round(CONFIG.track.startLineT * CONFIG.track.samples);
  const f = trackTable[i];
  const pos = f.pos.clone().addScaledVector(f.right, CONFIG.track.lanes[player]).addScaledVector(f.up, CONFIG.ships.hoverHeight);
  return { idx: i, frame: f, pos };
}

function makeShip(player, shipType) {
  const sp = spawnPose(player);
  const type = shipType || CONFIG.ships.shipPickDefault;
  const s = {
    player,
    type,
    pos: sp.pos.clone(),
    prevPos: sp.pos.clone(),
    velocity: new THREE.Vector3(0, 0, 0),
    heading: 0, prevHeading: 0,
    onGround: true, prevOnGround: true,
    forward: sp.frame.tangent.clone(),
    up: sp.frame.up.clone(),
    prevForward: sp.frame.tangent.clone(),
    prevUp: sp.frame.up.clone(),
    prevTangent: sp.frame.tangent.clone(),
    trackIdx: sp.idx,
    distAlong: sp.frame.dist,
    lane: CONFIG.track.lanes[player],
    height: CONFIG.ships.hoverHeight,
    visualRoll: 0, visualPitch: 0, prevVisualRoll: 0, prevVisualPitch: 0,
    boostEnergy: CONFIG.ships.maxEnergy * CONFIG.ships.energyStartFrac,
    shield: CONFIG.ships.maxShield,
    laneVel: 0, normalVel: 0, forwardVel: 0,
    effTop: CONFIG.ships.shipTypes[type].topSpeed,
    drifting: false,
    driftStreakSec: 0,
    lastValidIdx: sp.idx,
    lastValidLane: CONFIG.track.lanes[player],
    fellAt: 0,
    lastPadAt: -1e9,
    lastSideshiftAt: -1e9,
    sideshiftUntil: 0,
    respawnPenaltyUntil: 0,
    wallFlashUntil: 0,
    legoSmashUntil: 0,
    legoStudUntil: 0,
    landedFlashUntil: 0,
    perfectLandingUntil: 0,
    shakeMag: 0,
    lap: 0, passedMid: false, prevTrackIdx: sp.idx,
    bestLapMs: 0, lastLapMs: 0, lapStartMs: 0, totalRaceMs: 0, finished: false, finishPlace: 0,
    mesh: null,
  };
  return s;
}

function inGap(idx) {                      // same window the road mesh skips — ships fly over it freely
  const t = idx / CONFIG.track.samples;
  const g = CONFIG.track.jumpGap;
  return t >= g[0] && t <= g[1];
}

function nearestIndex(ship, maxSearch) {   // local window around last known index using real 3D distance
  const N = CONFIG.track.samples;
  let best = ship.trackIdx, bd = Infinity;
  for (let k = -12; k <= maxSearch; k++) {
    const j = ((ship.trackIdx + k) % N + N) % N;
    const sample = trackTable[j];
    if (!sample) continue;
    const d = sample.pos.distanceToSquared(ship.pos);
    if (d < bd) { bd = d; best = j; }
  }
  return best;
}

/* Input normalization: keyboard + gamepad -> the single dict physics consumes. */
function readInputs() {
  for (let p = 0; p < 2; p++) {
    const k = inputFor(p);
    const keySteer = (k.right ? 1 : 0) - (k.left ? 1 : 0);
    state.input[p] = {
      steerX: keySteer !== 0 ? keySteer : (k.steerAnalog || 0),
      throttle: k.thrust,
      brakeDown: k.brakeDown,
      brakeL: k.brakeL,
      brakeR: k.brakeR,
      boost: k.boost,
    };
  }
}

function wrapAngle(a) {
  let x = a + Math.PI;
  x -= Math.floor(x / (2 * Math.PI)) * (2 * Math.PI);
  return x - Math.PI;
}

/* ---- SHIP PHYSICS: single unified fixed-timestep step (120 Hz). --------- */
function stepShip(ship, dt) {
  const st = CONFIG.ships.shipTypes[ship.type] || CONFIG.ships.shipTypes.volt;
  const H = CONFIG.ships, P = CONFIG.physics;
  const inp = state.input[ship.player] || {};

  // Render-interpolation snapshot first
  ship.prevPos.copy(ship.pos);
  ship.prevHeading = ship.heading;
  ship.prevForward.copy(ship.forward);
  ship.prevUp.copy(ship.up);
  ship.prevVisualRoll = ship.visualRoll;
  ship.prevVisualPitch = ship.visualPitch;

  // If currently waiting out the 1 s fall-off respawn delay, hold until respawn completes
  if (ship.fellAt > 0) return;

  const N = CONFIG.track.samples;
  const totalDist = trackTable[N].dist;
  const dpp = totalDist / N;
  const maxSearch = Math.max(14, Math.ceil((ship.velocity.length() * dt) / dpp) + 14);

  // Fallback global search only if teleported / displaced far from last sample
  const pf = trackTable[ship.trackIdx];
  if (pf && pf.pos.distanceToSquared(ship.pos) > 900) {
    let bi = ship.trackIdx, bd = Infinity;
    for (let j = 0; j < N; j++) {
      const dd = trackTable[j].pos.distanceToSquared(ship.pos);
      if (dd < bd) { bd = dd; bi = j; }
    }
    ship.trackIdx = bi;
  }
  ship.trackIdx = nearestIndex(ship, maxSearch);
  const f = trackTable[ship.trackIdx];
  ship.distAlong = f.dist;

  // Track-relative coordinates entering this step (track frame yawed by deltaTang since last step!)
  if (ship.prevTangent) {
    // Keep world nose orientation continuous as track sample advances: heading is relative to f.tangent,
    // so when the road bends right by +dRoad, relative heading shifts by -dRoad unless the player steers!
    const dotT = Math.max(-1, Math.min(1, ship.prevTangent.dot(f.tangent)));
    S4.crossVectors(ship.prevTangent, f.tangent);
    const dRoad = Math.atan2(-S4.dot(f.up), dotT);
    ship.heading = wrapAngle(ship.heading - dRoad);
  } else {
    ship.prevTangent = new THREE.Vector3();
  }
  ship.prevTangent.copy(f.tangent);

  S1.copy(ship.pos).sub(f.pos);
  ship.lane = S1.dot(f.right);
  ship.height = S1.dot(f.up);

  const overRoad = !inGap(ship.trackIdx);
  const grounded = overRoad && ship.height <= H.maxHoverDist && ship.height >= -1.8;
  if (grounded) {
    ship.lastValidIdx = ship.trackIdx;
    ship.lastValidLane = Math.max(-CONFIG.track.roadHalfWidth * 0.5, Math.min(CONFIG.track.roadHalfWidth * 0.5, ship.lane));
  }

  // ---- 1. Steering & Airbrakes (yaw relative to track frame) --------------
  const mobileBoostHold = isMobile && ship.player === 0 && performance.now() < touchCtl.boostUntil;
  const boosting = !!(inp.boost && (ship.boostEnergy > 0 || mobileBoostHold));
  const effTop = st.topSpeed * (1 + (boosting ? H.boostTopSpeedBonus : 0));
  ship.effTop = effTop;

  // Nose forward F and right-side slip axis R_ship in the local track plane
  const cosH = Math.cos(ship.heading), sinH = Math.sin(ship.heading);
  S2.copy(f.tangent).multiplyScalar(cosH).addScaledVector(f.right, sinH).normalize(); // F (nose in track plane)
  S3.crossVectors(S2, f.up).normalize(); // ship-right in track plane (+lane when heading=0)

  // Decompose incoming world velocity into local track plane BEFORE yawing, so yawing the nose creates genuine slip!
  const vInPlaneFwd = ship.velocity.dot(S2);
  const vInPlaneSide = ship.velocity.dot(S3);
  const vNorm = ship.velocity.dot(f.up);

  const speedFrac = Math.max(0, Math.min(1.2, vInPlaneFwd / Math.max(1, st.topSpeed)));
  // Yaw rate decreases at high speed (spec 4), so tight hairpins require airbrakes!
  const steerRateEff = st.steerRate * (1 - P.steerSpeedTaper * Math.min(1, speedFrac));
  let dh = (inp.steerX || 0) * steerRateEff * P.steerSign * dt;

  const singleBrakeR = !!(inp.brakeR && !inp.brakeL);
  const singleBrakeL = !!(inp.brakeL && !inp.brakeR);
  const bothBrakes = !!(inp.brakeL && inp.brakeR);
  const steerVal = inp.steerX || 0;
  // Synergy check: same-side steer + airbrake (D+E or A+Q) vs airbrake alone vs counter-steer drift (A+E or D+Q)!
  const comboSameSide = (singleBrakeR && steerVal > 0.15) || (singleBrakeL && steerVal < -0.15);
  const yawMult = comboSameSide ? P.airbrakeYawGain * P.airbrakeComboYawBonus : P.airbrakeYawGain;

  if (singleBrakeR) dh += st.steerRate * yawMult * P.steerSign * dt;
  if (singleBrakeL) dh -= st.steerRate * yawMult * P.steerSign * dt;

  ship.heading = wrapAngle(ship.heading + dh);

  // Recompute nose F & ship-right S3 at the updated heading; project world velocity onto the new ship axes!
  const cosH1 = Math.cos(ship.heading), sinH1 = Math.sin(ship.heading);
  S2.copy(f.tangent).multiplyScalar(cosH1).addScaledVector(f.right, sinH1).normalize();
  S3.crossVectors(S2, f.up).normalize();
  let vF = ship.velocity.dot(S2);
  let vSide = ship.velocity.dot(S3);

  // Gentle velocity-alignment of heading only when no steering/airbrake is held, so ship doesn't spin forever
  if (grounded && !steerVal && !singleBrakeL && !singleBrakeR && vF > 4) {
    const velH = Math.atan2(ship.velocity.dot(f.right), Math.max(0.5, ship.velocity.dot(f.tangent)));
    const err = wrapAngle(velH - ship.heading);
    ship.heading = wrapAngle(ship.heading + err * Math.min(1, P.groundedAlignRate * dt));
  }

  // ---- 2. Thrust & Braking Curve (spec 3 & 5) -----------------------------
  const effFrac = Math.max(0, vF / effTop);
  let accel = 0;
  if (inp.throttle && effFrac < 1) {
    const taper = effFrac <= P.thrustKnee ? 1 : Math.pow((1 - effFrac) / (1 - P.thrustKnee), H.speedCurveExponent);
    accel = st.accel * taper * (boosting ? H.boostThrustMult : 1);
  } else if (!inp.throttle && !inp.brakeDown && !bothBrakes) {
    accel = -vF * P.coastDrag;
  }

  let decel = 0;
  if (inp.brakeDown) decel = st.airbrake * ((inp.brakeL || inp.brakeR) ? P.hardBrakeFactor : P.plainBrakeFrac);
  else if (bothBrakes) decel = st.airbrake * P.hardBrakeFactor;
  else if (singleBrakeL || singleBrakeR) {
    // Solo airbrake scrubs noticeable speed (pivot-brake); combining with same-side steer carves cleanly!
    decel = st.airbrake * (comboSameSide ? P.airbrakeComboDragFrac : P.airbrakeSoloDragFrac);
  }

  vF += accel * dt;
  if (decel > 0) vF = Math.max(0, vF - decel * dt);
  if (vF > effTop) vF -= (vF - effTop) * Math.min(1, P.overSpeedDamp * dt);

  // ---- 3. Lateral Grip, WipeOut Pivot-Drift & Double-Tap Sideshift --------
  let grip = grounded ? st.lateralGrip : st.lateralGrip * P.gripAirMult;
  if (singleBrakeL || singleBrakeR) {
    // Airbrake ALONE loosens rear grip into a wide drift; Steer + Airbrake (D+E / A+Q) hooks the apex hard!
    grip *= comboSameSide ? P.airbrakeComboGripMult : P.airbrakeSoloGripMult;
  }
  vSide *= Math.exp(-grip * dt);

  // Instant WipeOut 2097/HD Sideshift on double-tap Q-Q / E-E (or ,-, / .-.)!
  const nowMs = performance.now();
  const tap = airbrakeTapState[ship.player];
  if (tap && tap.pendingDir !== 0) {
    const dir = tap.pendingDir;
    tap.pendingDir = 0;
    if (nowMs - ship.lastSideshiftAt >= P.sideshiftCooldownMs) {
      vSide += dir * P.sideshiftImpulse;
      ship.lastSideshiftAt = nowMs;
      ship.sideshiftUntil = nowMs + 550;
      ship.shakeMag = Math.max(ship.shakeMag, 0.32);
    }
  }

  // Reconstruct 3D velocity ONCE before normal/gravity & external impulses
  ship.velocity.copy(S2).multiplyScalar(vF).addScaledVector(S3, vSide).addScaledVector(f.up, vNorm);

  // ---- 4. Boost Pads (spec 7): instant velocity kick + FOV/shake ----------
  if (grounded && nowMs - ship.lastPadAt > H.padCooldownMs) {
    const fracHere = ship.trackIdx / N;
    const halfFrac = (CONFIG.track.padLenAlong * 0.55) / totalDist;
    for (const bt of CONFIG.track.boostPadsT) {
      const dd = Math.min(Math.abs(fracHere - bt), Math.abs(fracHere - bt + 1), Math.abs(fracHere - bt - 1));
      if (dd <= halfFrac && Math.abs(ship.lane) <= CONFIG.track.padAcross * 0.75) {
        const cap = st.topSpeed * H.padCapFrac;
        const curSpd = ship.velocity.length();
        const targetSpd = Math.min(Math.max(curSpd, cap), curSpd + H.padInstantKick);
        const add = Math.max(0, targetSpd - curSpd);
        ship.velocity.addScaledVector(S2, add);
        ship.boostEnergy = Math.min(H.maxEnergy, ship.boostEnergy + 12);
        ship.lastPadAt = nowMs;
        ship.shakeMag = Math.max(ship.shakeMag, 0.45);
        break;
      }
    }
  }

  // ---- 5. Hover Spring vs. World -Y Gravity & Landings (spec 1 & 2) -------
  const groundBefore = ship.onGround;
  if (grounded) {
    const relUp = ship.velocity.dot(f.up);
    const springAcc = st.hoverK * (H.hoverHeight - ship.height) - st.hoverDamp * relUp;
    ship.velocity.addScaledVector(f.up, springAcc * dt);
    // Project gravity's along-track slope effect subtly so climbs/drops feel physical
    const slopeGravity = -H.gravity * f.tangent.y * 0.35;
    ship.velocity.addScaledVector(f.tangent, slopeGravity * dt);

    // Touchdown check!
    const spdNow = ship.velocity.length();
    if (!groundBefore && spdNow > H.landingMinSpeed) {
      S4.copy(ship.velocity).normalize();
      const alignDeg = Math.acos(Math.max(-1, Math.min(1, S2.dot(f.tangent)))) * 180 / Math.PI;
      const pitchErrDeg = Math.abs(ship.visualPitch) * 180 / Math.PI;
      if (alignDeg <= H.perfectLandingAngleDeg * 1.8 && pitchErrDeg <= 22) {
        ship.boostEnergy = Math.min(H.maxEnergy, ship.boostEnergy + H.landingBoostGain);
        ship.velocity.multiplyScalar(1 + H.landingSpeedBonusFrac);
        ship.perfectLandingUntil = nowMs + H.landingFlashMs;
      } else {
        ship.velocity.multiplyScalar(1 - H.badLandingScrubFrac);
      }
      ship.landedFlashUntil = nowMs + H.landingFlashMs;
      ship.shakeMag = Math.max(ship.shakeMag, 0.55);
    }
  } else {
    // Airborne: pure world -Y gravity, momentum preserved!
    ship.velocity.y -= H.gravity * dt;
  }

  // ---- 6. Integrate World Position & Resolve Track Surface / Walls --------
  ship.pos.addScaledVector(ship.velocity, dt);

  // Re-evaluate against nearest sample after integration so high speed never tunnels
  ship.trackIdx = nearestIndex(ship, maxSearch);
  const fAfter = trackTable[ship.trackIdx];
  ship.distAlong = fAfter.dist;
  S1.copy(ship.pos).sub(fAfter.pos);
  let laneNow = S1.dot(fAfter.right);
  let heightNow = S1.dot(fAfter.up);

  // Prevent sinking through the solid road mesh on hard landings
  const overRoadAfter = !inGap(ship.trackIdx);
  if (overRoadAfter && grounded && heightNow < 0.35) {
    heightNow = 0.35;
    const vn = ship.velocity.dot(fAfter.up);
    if (vn < 0) ship.velocity.addScaledVector(fAfter.up, -vn * 0.85);
    ship.pos.copy(fAfter.pos).addScaledVector(fAfter.right, laneNow).addScaledVector(fAfter.up, heightNow);
  }

  // Wall collision (spec 6): glancing hits slide with small loss; steep hits lose speed and BOUNCE inward
  const maxLane = CONFIG.track.roadHalfWidth - H.wallMargin;
  let wallHit = false;
  if (overRoadAfter && Math.abs(laneNow) > maxLane) {
    const sign = laneNow > 0 ? 1 : -1; // +1 = right wall, -1 = left wall
    laneNow = sign * maxLane;
    const vOut = ship.velocity.dot(fAfter.right) * sign; // speed into the wall
    const vAlong = ship.velocity.dot(fAfter.tangent);
    if (vOut > 0) {
      const impactAngleSin = vOut / (Math.hypot(vOut, vAlong) + 1e-5); // 0 = grazing, 1 = head-on
      const speedLoss = H.wallGrazingLoss + (H.wallHeadOnLoss - H.wallGrazingLoss) * impactAngleSin * impactAngleSin;
      // Bounce inward along -sign * right, and scrub forward speed proportionally to impact angle
      const bounceIn = Math.max(H.wallMinBounceSpeed * impactAngleSin, vOut * H.wallBounceRestitution);
      ship.velocity.addScaledVector(fAfter.right, -sign * (vOut + bounceIn));
      ship.velocity.multiplyScalar(Math.max(0.25, 1 - speedLoss));
      // Nudge heading slightly back toward track tangent so ship slides along the wall instead of sticking
      ship.heading = wrapAngle(ship.heading - sign * Math.min(0.35, impactAngleSin * 0.45));
      ship.shakeMag = Math.max(ship.shakeMag, 0.25 + 0.55 * impactAngleSin);
    }
    ship.pos.copy(fAfter.pos).addScaledVector(fAfter.right, laneNow).addScaledVector(fAfter.up, heightNow);
    wallHit = true;
    ship.wallFlashUntil = nowMs + H.wallFlashMs;
    ship.driftStreakSec = 0; // wall contact cancels clean drift streak
    if (typeof emitSparks === 'function') emitSparks(ship.pos, fAfter.up, sign * -1, 10);
  } else if (overRoadAfter && grounded && Math.abs(laneNow) > maxLane - H.wallScrapeBand && ship.velocity.lengthSq() > 225) {
    if (typeof emitSparks === 'function' && Math.random() < 0.35) emitSparks(ship.pos, fAfter.up, laneNow > 0 ? -1 : 1, 2);
  }

  ship.lane = laneNow;
  ship.height = heightNow;

  // ---- 7. Boost Energy & Clean Drift Rewards (spec 7 & 10) ----------------
  if (mobileBoostHold) {
    // Visual countdown: bar drains 100% → 0% across the swipe boost window
    const rem = Math.max(0, touchCtl.boostUntil - performance.now());
    ship.boostEnergy = (rem / CONFIG.input.mobileBoostMs) * H.maxEnergy;
  } else if (boosting) {
    ship.boostEnergy = Math.max(0, ship.boostEnergy - H.boostDrain * dt);
  } else {
    const onLine = grounded && Math.abs(ship.lane) <= P.racingLineAbsLane;
    const regenMult = onLine ? P.racingLineBoostRegenGain : 1.0;
    ship.boostEnergy = Math.min(H.maxEnergy, ship.boostEnergy + H.boostRegenIdle * regenMult * dt);
  }

  const fwdSpd = Math.max(0, ship.velocity.dot(S2));
  const sideSpd = ship.velocity.dot(S3);
  const slipDeg = Math.abs(Math.atan2(sideSpd, Math.max(1, fwdSpd))) * 180 / Math.PI;
  if (grounded && !wallHit && fwdSpd > P.driftMinSpeed && slipDeg >= P.driftMinDeg) {
    ship.drifting = true;
    ship.driftStreakSec += dt;
    ship.boostEnergy = Math.min(H.maxEnergy, ship.boostEnergy + P.driftAwardRate * dt);
  } else {
    ship.drifting = false;
    ship.driftStreakSec = Math.max(0, ship.driftStreakSec - dt * 2);
  }
  if (!Number.isFinite(ship.boostEnergy)) ship.boostEnergy = 0;

  // ---- 8. Visual Orientation (smooth up slerp, slide roll, air velocity pitch) -
  const targetRoll = Math.max(-H.maxVisualRoll, Math.min(H.maxVisualRoll, -sideSpd * H.slideVisualGain - (inp.steerX || 0) * 0.16));
  let targetPitch = 0;
  if (!grounded && ship.velocity.lengthSq() > 4) {
    S4.copy(ship.velocity).normalize();
    targetPitch = Math.max(-H.maxPitchRad, Math.min(H.maxPitchRad, Math.asin(Math.max(-1, Math.min(1, S4.y))) * 0.75));
  } else {
    targetPitch = Math.max(-0.35, Math.min(0.35, (H.hoverHeight - ship.height) * H.pitchVisualGain));
  }
  ship.visualRoll += (targetRoll - ship.visualRoll) * Math.min(1, H.visualRollRate * dt);
  ship.visualPitch += (targetPitch - ship.visualPitch) * Math.min(1, (grounded ? H.visualPitchRate : H.airPitchRate) * dt);

  // Smoothly align ship up-vector toward track normal when grounded, or gently toward world-up in air (spec 1)
  const desiredUp = grounded ? fAfter.up : WORLD_UP;
  const upRate = grounded ? H.groundUpLerpRate : 1.8;
  ship.up.lerp(desiredUp, Math.min(1, upRate * dt)).normalize();

  // Forward nose vector orthogonalized against smoothed ship.up, with pitch applied
  ship.forward.copy(fAfter.tangent).multiplyScalar(Math.cos(ship.heading)).addScaledVector(fAfter.right, Math.sin(ship.heading));
  ship.forward.projectOnPlane(ship.up).normalize();
  if (Math.abs(ship.visualPitch) > 1e-4) {
    S5.crossVectors(ship.forward, ship.up).normalize(); // local right axis
    ship.forward.applyAxisAngle(S5, ship.visualPitch).normalize();
  }

  ship.shakeMag = Math.max(0, ship.shakeMag - CONFIG.camera.shakeDecay * dt);
  ship.forwardVel = fwdSpd;
  ship.laneVel = sideSpd;
  ship.normalVel = ship.velocity.dot(fAfter.up);
  ship.prevOnGround = groundBefore;
  ship.onGround = grounded;
}

/* Spec 8: ship-vs-ship sphere collision with momentum exchange + sideways shove. */
function stepCollisions() {
  const H = CONFIG.ships;
  for (let i = 0; i < ships.length; i++) {
    for (let j = i + 1; j < ships.length; j++) {
      const a = ships[i], b = ships[j];
      if (a.fellAt > 0 || b.fellAt > 0) continue;
      const dx = a.pos.x - b.pos.x, dy = a.pos.y - b.pos.y, dz = a.pos.z - b.pos.z;
      const d2 = dx * dx + dy * dy + dz * dz, r = H.shipCollisionRadius;
      if (d2 >= r * r || d2 < 1e-9) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d, overlap = r - d;
      S1.set(nx, ny, nz);
      a.pos.addScaledVector(S1, overlap * 0.52);
      b.pos.addScaledVector(S1, -overlap * 0.52);
      const approach = (a.velocity.x - b.velocity.x) * nx + (a.velocity.y - b.velocity.y) * ny + (a.velocity.z - b.velocity.z) * nz;
      const jImp = approach < 0 ? -approach * H.collisionImpulse * 0.5 : 0;
      const shove = H.collisionSideShove * 0.5;
      a.velocity.addScaledVector(S1, jImp + shove);
      b.velocity.addScaledVector(S1, -(jImp + shove));
      a.shakeMag = Math.max(a.shakeMag, 0.4);
      b.shakeMag = Math.max(b.shakeMag, 0.4);
    }
  }
  stepLegoInteractions();
}

/* ---- Interactive LEGO props on the racing line (smash crates / collect studs) ---- */
let legoPropState = [];
let legoPropGroup = null;

function legoPropMat(hex, emissiveIntensity = 0.2) {
  return legoPlasticMat(hex, hex, emissiveIntensity);
}

function buildLegoPropMesh(kind) {
  const g = new THREE.Group();
  const red = legoPropMat('#c91a09', 0.22);
  const yellow = legoPropMat('#f5cd2f', 0.28);
  const blue = legoPropMat('#0055bf', 0.22);
  const green = legoPropMat('#00852b', 0.22);
  const white = legoPropMat('#f4f4f4', 0.12);
  const U = LEGO.U, PH = LEGO.PLATE_H, BH = LEGO.BRICK_H;

  if (kind === 'stud') {
    // Floating translucent-ish gold stud pickup
    const gem = legoPropMat('#ffd24d', 0.55);
    placeBrick(g, makeLegoBrick(2, 1, 2, gem), 0, 0, 0);
    placeBrick(g, makeLegoBrick(1, 1, 1, yellow, { studs: false }), 0, PH, 0);
  } else if (kind === 'tower') {
    placeBrick(g, makeLegoBrick(2, 1, 2, blue), 0, 0, 0);
    placeBrick(g, makeLegoBrick(2, 3, 2, red), 0, PH, 0);
    placeBrick(g, makeLegoBrick(2, 3, 2, yellow), 0, PH + BH, 0);
    placeBrick(g, makeLegoBrick(2, 1, 2, white), 0, PH + BH * 2, 0);
  } else {
    // crate — short 2×2 stack obstacle
    placeBrick(g, makeLegoBrick(2, 1, 2, green), 0, 0, 0);
    placeBrick(g, makeLegoBrick(2, 3, 2, red), 0, PH, 0);
    placeBrick(g, makeLegoBrick(2, 1, 2, yellow), 0, PH + BH, 0);
  }
  g.scale.setScalar(CONFIG.track.legoScale);
  return g;
}

function disposeLegoProps() {
  if (legoPropGroup) {
    scene.remove(legoPropGroup);
    legoPropGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) m.dispose();
      }
    });
  }
  legoPropGroup = null;
  legoPropState = [];
}

function buildLegoProps() {
  disposeLegoProps();
  if (!trackTable.length) return;
  legoPropGroup = new THREE.Group();
  legoPropGroup.name = 'legoProps';
  scene.add(legoPropGroup);
  const N = CONFIG.track.samples;
  const gap = CONFIG.track.jumpGap;
  for (const def of CONFIG.track.legoProps) {
    if (def.t >= gap[0] - 0.02 && def.t <= gap[1] + 0.02) continue; // never in the jump void
    const idx = Math.round(def.t * N) % N;
    const f = trackTable[idx];
    const mesh = buildLegoPropMesh(def.kind);
    const hover = def.kind === 'stud' ? 1.35 : 0.15;
    mesh.position.copy(f.pos).addScaledVector(f.right, def.lane).addScaledVector(f.up, hover);
    // Sit upright on track frame (no ship roll)
    M4.makeBasis(f.right, f.up, f.tangent);
    mesh.quaternion.setFromRotationMatrix(M4);
    mesh.userData.baseQuat = mesh.quaternion.clone();
    legoPropGroup.add(mesh);
    legoPropState.push({
      kind: def.kind,
      lane: def.lane,
      trackIdx: idx,
      mesh,
      active: true,
      respawnAt: 0,
      basePos: mesh.position.clone(),
      up: f.up.clone(),
      spin: Math.random() * Math.PI * 2,
    });
  }
}

function stepLegoInteractions() {
  if (!legoPropState.length || state.phase === 'select') return;
  const T = CONFIG.track;
  const now = performance.now();
  for (const prop of legoPropState) {
    if (!prop.active) {
      if (prop.respawnAt && now >= prop.respawnAt) {
        prop.active = true;
        prop.respawnAt = 0;
        prop.mesh.visible = true;
        prop.mesh.scale.setScalar(T.legoScale);
      }
      continue;
    }
    for (const ship of ships) {
      if (!ship || ship.fellAt > 0) continue;
      const dx = ship.pos.x - prop.basePos.x;
      const dy = ship.pos.y - prop.basePos.y;
      const dz = ship.pos.z - prop.basePos.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      const rad = prop.kind === 'stud' ? T.legoStudRadius : T.legoHitRadius;
      if (d2 > rad * rad) continue;

      prop.active = false;
      prop.respawnAt = now + T.legoRespawnMs;
      prop.mesh.visible = false;

      if (prop.kind === 'stud') {
        ship.boostEnergy = Math.min(CONFIG.ships.maxEnergy, ship.boostEnergy + T.legoStudBoost);
        ship.legoStudUntil = now + 900;
        ship.shakeMag = Math.max(ship.shakeMag, 0.18);
      } else {
        // Smash crate/tower: bounce, scrub a bit of speed, grant a little boost, sparks
        const f = trackTable[ship.trackIdx] || trackTable[prop.trackIdx];
        S1.copy(ship.pos).sub(prop.basePos);
        if (S1.lengthSq() < 1e-6) S1.copy(f.tangent);
        S1.normalize();
        ship.velocity.addScaledVector(S1, T.legoSmashImpulse);
        ship.velocity.multiplyScalar(prop.kind === 'tower' ? 0.88 : 0.93);
        ship.boostEnergy = Math.min(CONFIG.ships.maxEnergy, ship.boostEnergy + T.legoCrateBoost);
        ship.legoSmashUntil = now + 850;
        ship.shakeMag = Math.max(ship.shakeMag, prop.kind === 'tower' ? 0.55 : 0.4);
        emitSparks(prop.basePos, f.up, 0, prop.kind === 'tower' ? 14 : 9);
      }
      break;
    }
  }
}

function updateLegoPropsVisual(dt, nowMs) {
  if (!legoPropState.length) return;
  for (const prop of legoPropState) {
    if (!prop.active) continue;
    prop.spin += dt * (prop.kind === 'stud' ? 2.8 : 0.55);
    if (prop.kind === 'stud') {
      const bob = Math.sin(nowMs * 0.005 + prop.spin) * 0.22;
      prop.mesh.position.copy(prop.basePos).addScaledVector(prop.up, bob);
      prop.mesh.quaternion.copy(prop.mesh.userData.baseQuat);
      prop.mesh.rotateOnAxis(prop.up, prop.spin);
    } else {
      // Subtle idle wobble so crates read as toys, not scenery
      prop.mesh.position.copy(prop.basePos);
      prop.mesh.quaternion.copy(prop.mesh.userData.baseQuat);
      prop.mesh.rotateOnAxis(prop.up, Math.sin(prop.spin) * 0.08);
    }
  }
}

/* If you fell in / around the jump, snap lastValid to the landing apron (not the ramp). */
function snapRespawnPastJump(ship) {
  const N = CONFIG.track.samples;
  const gap = CONFIG.track.jumpGap;
  const tNow = ship.trackIdx / N;
  const tValid = (ship.lastValidIdx ?? 0) / N;
  // Launch lip, void, or short of the landing — don't put them back on the ramp
  const missedJump =
    (tNow >= gap[0] - 0.02 && tNow <= gap[1] + 0.08) ||
    (tValid >= gap[0] - 0.045 && tValid <= gap[1]);
  if (!missedJump) return;
  const landIdx = Math.min(N - 1, Math.ceil(gap[1] * N) + 12);
  const hw = CONFIG.track.roadHalfWidth;
  ship.lastValidIdx = landIdx;
  ship.lastValidLane = Math.max(-hw * 0.45, Math.min(hw * 0.45, ship.lastValidLane ?? CONFIG.track.lanes[ship.player]));
}

/* Spec 9: falling off track -> respawn after 1 s at the LAST VALID POINT with speed penalty. */
function checkRespawn(ship) {
  const H = CONFIG.ships;
  const nowMs = performance.now();
  if (ship.fellAt > 0) {
    if (nowMs - ship.fellAt >= H.respawnDelayMs) {
      snapRespawnPastJump(ship);
      const idx = ship.lastValidIdx ?? Math.round(CONFIG.track.startLineT * CONFIG.track.samples);
      const g = trackTable[idx];
      const lane = ship.lastValidLane ?? CONFIG.track.lanes[ship.player];
      ship.pos.copy(g.pos).addScaledVector(g.right, lane).addScaledVector(g.up, H.hoverHeight);
      ship.prevPos.copy(ship.pos);
      const keptSpeed = Math.min(30, ship.savedSpeed * H.respawnKeepFrac);
      ship.velocity.copy(g.tangent).multiplyScalar(keptSpeed);
      ship.heading = 0;
      ship.forward.copy(g.tangent); ship.prevForward.copy(g.tangent);
      ship.up.copy(g.up); ship.prevUp.copy(g.up);
      if (ship.prevTangent) ship.prevTangent.copy(g.tangent);
      ship.visualRoll = 0; ship.visualPitch = 0;
      ship.onGround = true; ship.prevOnGround = true;
      ship.trackIdx = idx; ship.distAlong = g.dist;
      ship.lane = lane; ship.height = H.hoverHeight;
      ship.fellAt = 0;
      ship.respawnPenaltyUntil = nowMs + H.respawnPenaltyTime * 1000;
    }
    return;
  }
  // Trigger fall-off if ship drops far below the track (including missing the jump gap!)
  if (ship.height < -H.respawnDropDepth) {
    ship.savedSpeed = ship.velocity.length();
    ship.fellAt = nowMs;
    snapRespawnPastJump(ship);
  }
}

/* ---- CAMERA: one PerspectiveCamera per viewport (spec: separate cameras) */
function makeCamera(player) {
  const hh = Math.max(1, Math.floor(window.innerHeight / 2));
  const cam = new THREE.PerspectiveCamera(CONFIG.camera.fovBase, window.innerWidth / hh, 0.1, 2000);
  scene.add(cam);
  return {
    player, cam,
    pos: new THREE.Vector3(),
    offset: new THREE.Vector3(0, CONFIG.camera.upDistance, -CONFIG.camera.backDistance),
    vel: new THREE.Vector3(),
    shakePhase: player * 2.1,
  };
}

/* Chase camera: springs the RELATIVE OFFSET (so ship never outruns camera at 600+ km/h!),
   plus small speed stretch, FOV ramp, partial track-up adoption, and impact shake. */
function updateCamera(rc, ship, dt, renderShipPos) {
  const C = CONFIG.camera;
  const anchor = renderShipPos || ship.pos;
  const f = trackTable[ship.trackIdx] || { up: WORLD_UP };
  const clampedDt = Math.min(0.1, Math.max(0, dt));
  const subSteps = Math.max(1, Math.ceil(clampedDt / (1 / 60)));
  const subDt = clampedDt / subSteps;
  const damp = 2 * Math.sqrt(C.springStiffness);

  // Subtle dynamic stretch (max +0.55 m at top speed) so acceleration feels alive while keeping standard chase distance!
  const spdFrac = Math.min(1.2, ship.velocity.length() / C.speedRefForFov);
  const targetBack = C.backDistance + spdFrac * 0.55;
  S1.copy(ship.forward).multiplyScalar(-targetBack).addScaledVector(f.up, C.upDistance);

  for (let i = 0; i < subSteps; i++) {
    S2.copy(S1).sub(rc.offset).multiplyScalar(C.springStiffness);
    rc.vel.addScaledVector(S2, subDt);
    rc.vel.multiplyScalar(Math.exp(-damp * subDt));
    rc.offset.addScaledVector(rc.vel, subDt);
  }
  rc.pos.copy(anchor).add(rc.offset);

  // Camera up: blend world-up with track's local up (spec: strong bank feel, never nauseating)
  S2.copy(f.up).multiplyScalar(C.upInfluence).addScaledVector(WORLD_UP, 1 - C.upInfluence).normalize();
  rc.cam.up.lerp(S2, Math.min(1, C.upLerpRate * clampedDt)).normalize();

  // Look-ahead + subtle procedural shake on wall hits / landings / boost pads
  rc.cam.position.copy(rc.pos);
  if (C.shakeGain > 0 && ship.shakeMag > 0.005) {
    rc.shakePhase += clampedDt * 47;
    const amp = ship.shakeMag * C.shakeGain;
    rc.cam.position.x += Math.sin(rc.shakePhase * 1.7) * amp;
    rc.cam.position.y += Math.cos(rc.shakePhase * 2.3) * amp * 0.8;
    rc.cam.position.z += Math.sin(rc.shakePhase * 1.3) * amp;
  }
  S1.copy(anchor).addScaledVector(ship.forward, C.lookAhead);
  rc.cam.lookAt(S1);

  const targetFov = THREE.MathUtils.lerp(C.fovBase, C.fovMax, Math.min(1, spdFrac));
  rc.cam.fov += (targetFov - rc.cam.fov) * Math.min(1, C.fovLerp * clampedDt);
  rc.cam.updateProjectionMatrix();
}

/* ---- RENDER & PHASE 6 FX ("AAA Neon": PMREM envmap, Bloom, Chroma, Trails, Sparks, Speed Lines) */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: CONFIG.render.preserveDrawingBuffer });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.render.maxPixelRatio));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMappingExposure = CONFIG.render.toneMappingExposure;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// Soft pre-filtered environment map (sigma=0.14 blurs out the intense white studio softboxes in RoomEnvironment so the track has smooth dark sci-fi reflections without harsh white glare!)
const pmremGen = new THREE.PMREMGenerator(renderer);
const envRT = pmremGen.fromScene(new RoomEnvironment(), 0.14);
scene.environment = envRT.texture;
pmremGen.dispose();

// Radial high-speed chromatic aberration shader pass
const ChromaShader = {
  uniforms: {
    tDiffuse: { value: null },
    amount: { value: 0.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float amount;
    varying vec2 vUv;
    void main() {
      vec2 off = (vUv - 0.5) * amount * length(vUv - 0.5) * 2.2;
      float r = texture2D(tDiffuse, vUv + off).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - off).b;
      gl_FragColor = vec4(r, g, b, 1.0);
    }`,
};

// ONE single EffectComposer over the full split-screen render target (cuts post-FX GPU cost in HALF -> locked 144 FPS!)
let mainComposer = null, mainBloom = null, mainFxaaChroma = null;

function buildComposers() {
  if (mainComposer) mainComposer.dispose();
  const pr = renderer.getPixelRatio();
  const w = Math.max(2, window.innerWidth), h = Math.max(4, window.innerHeight);
  const effW = Math.floor(w * pr), effH = Math.floor(h * pr);

  // Pass a non-MSAA HalfFloat render target into EffectComposer so swapBuffers() never triggers a double 16-bit MSAA resolve stall!
  // Our 9-tap directional FXAA pass smooths all edges at locked 144 FPS!
  const rt = new THREE.WebGLRenderTarget(effW, effH, {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    samples: 0,
  });

  mainComposer = new EffectComposer(renderer, rt);
  mainComposer.renderToScreen = true;
  mainComposer.setPixelRatio(pr);
  mainComposer.setSize(w, h);

  // Pass 1: quarter-res Bloom (only ONCE per frame for the whole split-screen!)
  mainBloom = new UnrealBloomPass(
    new THREE.Vector2(Math.max(2, Math.floor(w * 0.35)), Math.max(2, Math.floor(h * 0.35))),
    CONFIG.render.bloomStrength,
    CONFIG.render.bloomRadius,
    CONFIG.render.bloomThreshold
  );

  // Pass 2: ACESFilmic + sRGB OutputPass
  const outPass = new OutputPass();

  // Pass 3: Combined FXAA + per-half speed chromatic aberration (top half uses P1 speed, bottom half uses P2 speed!)
  mainFxaaChroma = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      resolution: { value: new THREE.Vector2(1 / effW, 1 / effH) },
      chromaTop: { value: 0.0 },
      chromaBot: { value: 0.0 },
    },
    vertexShader: FXAAShader.vertexShader,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform vec2 resolution;
      uniform float chromaTop;
      uniform float chromaBot;
      varying vec2 vUv;
      void main() {
        vec3 rgbNW = texture2D(tDiffuse, vUv + vec2(-1.0, -1.0) * resolution).rgb;
        vec3 rgbNE = texture2D(tDiffuse, vUv + vec2( 1.0, -1.0) * resolution).rgb;
        vec3 rgbSW = texture2D(tDiffuse, vUv + vec2(-1.0,  1.0) * resolution).rgb;
        vec3 rgbSE = texture2D(tDiffuse, vUv + vec2( 1.0,  1.0) * resolution).rgb;
        vec3 rgbM  = texture2D(tDiffuse, vUv).rgb;
        vec3 luma = vec3(0.299, 0.587, 0.114);
        float lNW = dot(rgbNW, luma), lNE = dot(rgbNE, luma), lSW = dot(rgbSW, luma), lSE = dot(rgbSE, luma), lM = dot(rgbM, luma);
        float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
        float lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
        vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
        float dirReduce = max((lNW + lNE + lSW + lSE) * (0.25 * 0.125), 1.0 / 128.0);
        float rcpDirMin = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
        dir = clamp(dir * rcpDirMin, vec2(-8.0), vec2(8.0)) * resolution;
        vec3 rgbA = 0.5 * (texture2D(tDiffuse, vUv + dir * (1.0/3.0 - 0.5)).rgb + texture2D(tDiffuse, vUv + dir * (2.0/3.0 - 0.5)).rgb);
        vec3 rgbB = rgbA * 0.5 + 0.25 * (texture2D(tDiffuse, vUv + dir * -0.5).rgb + texture2D(tDiffuse, vUv + dir * 0.5).rgb);
        float lB = dot(rgbB, luma);
        vec3 aaCol = (lB < lMin || lB > lMax) ? rgbA : rgbB;
        float cAmt = vUv.y >= 0.5 ? chromaTop : chromaBot;
        if (cAmt > 0.0001) {
          vec2 localCenter = vec2(0.5, vUv.y >= 0.5 ? 0.75 : 0.25);
          vec2 off = (vUv - localCenter) * cAmt * length(vUv - localCenter) * 2.4;
          aaCol.r = texture2D(tDiffuse, vUv + off).r;
          aaCol.b = texture2D(tDiffuse, vUv - off).b;
        }
        gl_FragColor = vec4(aaCol, 1.0);
      }`,
  });

  mainComposer.addPass(mainBloom);
  mainComposer.addPass(outPass);
  mainComposer.addPass(mainFxaaChroma);
}

/* ---- LEGO brick kit (classic 8 mm stud pitch → world units) ------------ */
const LEGO = {
  U: 0.32,
  get BRICK_H() { return this.U * 1.2; },
  get PLATE_H() { return this.U * 0.4; },
  get STUD_R() { return this.U * 0.30; },
  get STUD_H() { return this.U * 0.22; },
  _studGeo: null,
  _cylCache: new Map(),
  studGeo() {
    if (!this._studGeo) this._studGeo = new THREE.CylinderGeometry(this.STUD_R, this.STUD_R, this.STUD_H, 8);
    return this._studGeo;
  },
  cylGeo(r0, r1, h, seg = 8) {
    const key = `${r0.toFixed(3)}_${r1.toFixed(3)}_${h.toFixed(3)}_${seg}`;
    if (!this._cylCache.has(key)) this._cylCache.set(key, new THREE.CylinderGeometry(r0, r1, h, seg));
    return this._cylCache.get(key);
  },
};

function legoPlasticMat(hex, emissiveHex, emissiveIntensity = 0.28) {
  return new THREE.MeshStandardMaterial({
    color: hex,
    emissive: emissiveHex || hex,
    emissiveIntensity,
    roughness: 0.42,
    metalness: 0.08,
    envMapIntensity: 0.85,
  });
}

function legoTransMat(hex, emissiveHex) {
  // Cheap translucent ABS — NO MeshPhysical transmission (keeps 144 FPS)
  return new THREE.MeshStandardMaterial({
    color: hex,
    emissive: emissiveHex || hex,
    emissiveIntensity: 0.28,
    roughness: 0.22,
    metalness: 0.15,
    transparent: true,
    opacity: 0.72,
    envMapIntensity: 1.05,
  });
}

/** Single-mesh brick/plate with baked studs (1 draw call). Origin = geometric centre. */
function makeLegoBrick(sx, syModules, sz, mat, { studs = true } = {}) {
  const U = LEGO.U;
  const h = syModules * LEGO.PLATE_H;
  const body = new THREE.BoxGeometry(sx * U, h, sz * U);
  if (!studs) {
    const mesh = new THREE.Mesh(body, mat);
    mesh.userData.halfH = h * 0.5;
    return mesh;
  }
  const geos = [body];
  const yTop = h * 0.5 + LEGO.STUD_H * 0.5;
  for (let ix = 0; ix < sx; ix++) {
    for (let iz = 0; iz < sz; iz++) {
      const stud = LEGO.studGeo().clone();
      stud.translate((ix - (sx - 1) * 0.5) * U, yTop, (iz - (sz - 1) * 0.5) * U);
      geos.push(stud);
    }
  }
  const merged = mergeLegoGeos(geos);
  for (const geo of geos) geo.dispose();
  const mesh = new THREE.Mesh(merged, mat);
  mesh.userData.halfH = h * 0.5;
  return mesh;
}

function mergeLegoGeos(geos) {
  // Manual merge (no BufferGeometryUtils import) — positions + normals only
  let vCount = 0;
  for (const g of geos) vCount += g.attributes.position.count;
  const pos = new Float32Array(vCount * 3);
  const nrm = new Float32Array(vCount * 3);
  const idx = [];
  let vo = 0;
  for (const g of geos) {
    const p = g.attributes.position;
    const n = g.attributes.normal;
    const base = vo;
    for (let i = 0; i < p.count; i++, vo++) {
      pos[vo * 3] = p.getX(i); pos[vo * 3 + 1] = p.getY(i); pos[vo * 3 + 2] = p.getZ(i);
      if (n) { nrm[vo * 3] = n.getX(i); nrm[vo * 3 + 1] = n.getY(i); nrm[vo * 3 + 2] = n.getZ(i); }
    }
    if (g.index) {
      const a = g.index.array;
      for (let i = 0; i < a.length; i++) idx.push(a[i] + base);
    } else {
      for (let i = 0; i < p.count; i++) idx.push(base + i);
    }
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  out.setIndex(idx);
  return out;
}

/** 45° slope brick: tall at -Z, tip at +Z. Height in plate modules. */
function makeLegoSlope(sx, syModules, sz, mat) {
  const U = LEGO.U;
  const h = syModules * LEGO.PLATE_H;
  const hw = sx * U * 0.5, hh = h * 0.5, hd = sz * U * 0.5;
  const yTip = -hh + LEGO.PLATE_H * 0.12;
  const v = [
    [-hw, -hh, -hd], [hw, -hh, -hd], [hw, hh, -hd], [-hw, hh, -hd],
    [-hw, -hh,  hd], [hw, -hh,  hd], [hw, yTip, hd], [-hw, yTip, hd],
  ];
  const faces = [[0,1,2],[0,2,3],[4,6,5],[4,7,6],[0,4,5],[0,5,1],[3,2,6],[3,6,7],[0,3,7],[0,7,4],[1,5,6],[1,6,2]];
  const pos = [], nrm = [];
  for (const f of faces) {
    const a = v[f[0]], b = v[f[1]], c = v[f[2]];
    pos.push(...a, ...b, ...c);
    const ax = b[0]-a[0], ay = b[1]-a[1], az = b[2]-a[2];
    const bx = c[0]-a[0], by = c[1]-a[1], bz = c[2]-a[2];
    let nx = ay*bz - az*by, ny = az*bx - ax*bz, nz = ax*by - ay*bx;
    const len = Math.hypot(nx, ny, nz) || 1;
    nx /= len; ny /= len; nz /= len;
    nrm.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.halfH = hh;
  return mesh;
}

function placeBrick(parent, brick, xStuds, yBottom, zStuds) {
  brick.position.set(xStuds * LEGO.U, yBottom + (brick.userData.halfH || 0), zStuds * LEGO.U);
  parent.add(brick);
  return brick;
}

/* Ship mesh: low piece-count LEGO AG racers (team colours, classic ABS look, few draw calls). */
function buildShipMesh(player, shipType) {
  const g = new THREE.Group();
  const type = shipType || (ships && ships[player] ? ships[player].type : CONFIG.ships.shipPickDefault);
  const colHex = CONFIG.ships.colors[player];
  const isVolt = type === 'volt';
  const isP1 = player === 0;

  // Keep ABS plastic mostly lit by scene lights — high emissive floods UnrealBloomPass across the split midline!
  const teamMat = legoPlasticMat(colHex, colHex, 0.18);
  const whiteMat = legoPlasticMat('#f4f7fb', '#a8c4ef', 0.10);
  const greyMat = legoPlasticMat('#6b727a', '#3a4048', 0.06);
  const blackMat = legoPlasticMat('#1a1d22', '#0a0c10', 0.04);
  const neonMat = new THREE.MeshStandardMaterial({
    color: colHex,
    emissive: colHex,
    emissiveIntensity: 0.55,
    roughness: 0.35,
    metalness: 0.1,
  });
  const canopyMat = legoTransMat(isP1 ? '#3ad4ff' : '#ff5ad8', colHex);
  const thrusterGlow = new THREE.MeshBasicMaterial({
    color: new THREE.Color(isP1 ? '#6bf6ff' : '#ff7af0').multiplyScalar(1.55),
  });

  const U = LEGO.U;
  const BH = LEGO.BRICK_H;
  const PH = LEGO.PLATE_H;

  if (isVolt) {
    // VOLT — long dart (~14 pieces): 2× spine, nose slope, thin swept wings, twin round jets
    placeBrick(g, makeLegoBrick(2, 1, 8, teamMat), 0, 0, -0.5);
    placeBrick(g, makeLegoBrick(2, 1, 6, greyMat, { studs: false }), 0, PH, -1.0);
    placeBrick(g, makeLegoSlope(2, 3, 3, teamMat), 0, PH, 2.6);
    placeBrick(g, makeLegoBrick(2, 1, 2, whiteMat), 0, PH, 0.8);
    placeBrick(g, makeLegoBrick(2, 2, 2, canopyMat, { studs: false }), 0, PH + PH, 0.8);
    placeBrick(g, makeLegoBrick(1, 1, 4, neonMat, { studs: false }), 0, PH + PH * 3, -0.5);
    for (const side of [-1, 1]) {
      placeBrick(g, makeLegoBrick(3, 1, 2, teamMat), side * 2.0, PH * 0.5, -1.2);
      placeBrick(g, makeLegoBrick(1, 1, 2, neonMat, { studs: false }), side * 3.2, PH * 1.5, -1.2);
      placeBrick(g, makeLegoBrick(1, 3, 2, whiteMat, { studs: false }), side * 0.85, PH, -3.0);
      const jet = new THREE.Mesh(LEGO.cylGeo(U * 0.72, U * 0.78, U * 1.1), greyMat);
      jet.rotation.x = Math.PI / 2;
      jet.position.set(side * U * 0.85, PH + BH * 0.35, -U * 4.15);
      g.add(jet);
    }
  } else {
    // ARC — wide delta (~16 pieces): 4× chassis, stepped wings, angled airbrake fins, fat jets
    placeBrick(g, makeLegoBrick(4, 1, 6, teamMat), 0, 0, -0.5);
    placeBrick(g, makeLegoBrick(4, 1, 4, greyMat, { studs: false }), 0, PH, -1.2);
    placeBrick(g, makeLegoSlope(2, 2, 2, teamMat), 0, PH, 2.2);
    placeBrick(g, makeLegoBrick(2, 1, 2, whiteMat), 0, PH, 0.5);
    placeBrick(g, makeLegoBrick(2, 2, 2, canopyMat, { studs: false }), 0, PH + PH, 0.5);
    placeBrick(g, makeLegoBrick(2, 1, 2, blackMat, { studs: false }), 0, PH + PH * 3, -0.8);
    for (const side of [-1, 1]) {
      placeBrick(g, makeLegoBrick(3, 1, 3, teamMat), side * 2.5, 0, -0.8);
      placeBrick(g, makeLegoBrick(2, 1, 2, teamMat), side * 3.5, PH, -1.6);
      placeBrick(g, makeLegoBrick(1, 1, 2, neonMat, { studs: false }), side * 4.4, PH * 2, -1.6);
      const fin = makeLegoBrick(1, 4, 2, whiteMat, { studs: false });
      fin.position.set(side * U * 1.35, PH + BH * 0.85, -U * 2.4);
      fin.rotation.z = -side * 0.38;
      fin.rotation.x = 0.12;
      g.add(fin);
      const jet = new THREE.Mesh(LEGO.cylGeo(U * 0.88, U * 0.95, U * 1.25), greyMat);
      jet.rotation.x = Math.PI / 2;
      jet.position.set(side * U * 1.15, PH + BH * 0.4, -U * 3.55);
      g.add(jet);
    }
  }

  const eng = new THREE.Mesh(
    new THREE.BoxGeometry(isVolt ? U * 2.4 : U * 3.2, U * 0.7, U * 0.55),
    thrusterGlow
  );
  eng.position.set(0, PH + BH * 0.35, isVolt ? -U * 4.55 : -U * 3.95);
  g.add(eng);

  const underLight = new THREE.PointLight(colHex, 1.8, 7.5, 2.0);
  underLight.position.set(0, -0.35, -0.6);
  g.add(underLight);

  g.position.y = -PH * 0.5;
  g.userData = { player, type, engine: eng };
  return g;
}

function makeSoftGlowTexture(hexCol) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(hexCol);
  const r = Math.round(col.r * 255), g = Math.round(col.g * 255), b = Math.round(col.b * 255);
  ctx.clearRect(0, 0, 256, 256);

  // Soft glossy wet-asphalt reflection: realistic blurred reflection on dark wet road (anisotropic sheen + wingtips + thruster!)
  ctx.save();
  ctx.filter = 'blur(12px)';
  const grad = ctx.createRadialGradient(128, 138, 4, 128, 138, 96);
  grad.addColorStop(0.0, `rgba(${r},${g},${b},0.48)`);
  grad.addColorStop(0.5, `rgba(${r},${g},${b},0.18)`);
  grad.addColorStop(1.0, `rgba(${r},${g},${b},0.0)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);

  // Blurred hull & wing reflection (blur 7px so it reads as a glossy surface reflection, NEVER a second solid ship!)
  ctx.filter = 'blur(7px)';
  ctx.fillStyle = `rgba(${r},${g},${b},0.58)`;
  ctx.beginPath();
  ctx.moveTo(128, 42);
  ctx.lineTo(208, 162);
  ctx.lineTo(196, 188);
  ctx.lineTo(60, 188);
  ctx.lineTo(48, 162);
  ctx.closePath();
  ctx.fill();

  // Reflected neon wingtips & twin thruster streak
  ctx.filter = 'blur(5px)';
  ctx.fillStyle = `rgba(${Math.min(255, r + 85)},${Math.min(255, g + 85)},${Math.min(255, b + 85)},0.82)`;
  ctx.fillRect(42, 148, 14, 42);
  ctx.fillRect(200, 148, 14, 42);
  ctx.fillRect(104, 178, 48, 22);
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* Glossy wet-asphalt ship reflection: depth-tested glossy silhouette decal strictly ON the road surface! */
function buildShipReflectionMesh(player) {
  const colHex = CONFIG.ships.colors[player];
  const puddle = new THREE.Mesh(
    new THREE.PlaneGeometry(3.9, 4.4),
    new THREE.MeshBasicMaterial({
      map: makeSoftGlowTexture(colHex),
      transparent: true,
      opacity: CONFIG.render.shipReflectionOpacity,
      blending: THREE.NormalBlending,
      depthTest: true,   // 100% Z-buffer tested: NEVER draws over closer ships, walls, or track!
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -2,
      side: THREE.DoubleSide,
    })
  );
  puddle.renderOrder = 1;
  return puddle;
}

/* ---- Engine Ribbon Trails, Wall Sparks & High-Speed Lines --------------- */
let trailMeshes = [];
/** Neon engine ribbons removed — only dispose leftovers on rematch. */
function buildTrails() {
  for (const t of trailMeshes) {
    if (!t) continue;
    if (t.mesh) {
      scene.remove(t.mesh);
      t.mesh.geometry.dispose();
      t.mesh.material.dispose();
    }
    if (t.reflMesh) {
      scene.remove(t.reflMesh);
      t.reflMesh.geometry.dispose();
      t.reflMesh.material.dispose();
    }
  }
  trailMeshes = [];
}

// Spark particle pool on wall contact
const sparkPool = [];
let sparkMesh = null, sparkCursor = 0;
{
  const M = CONFIG.render.maxSparks;
  const sPos = new Float32Array(M * 2 * 3); // line segments for streaky sparks!
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  const mat = new THREE.LineBasicMaterial({ color: new THREE.Color('#ffd166').multiplyScalar(2.4), blending: THREE.AdditiveBlending, transparent: true });
  sparkMesh = new THREE.LineSegments(geo, mat);
  sparkMesh.frustumCulled = false;
  scene.add(sparkMesh);
  for (let i = 0; i < M; i++) sparkPool.push({ life: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 });
}

function emitSparks(origin, upVec, inwardSign, count) {
  const M = sparkPool.length;
  for (let k = 0; k < count; k++) {
    const sp = sparkPool[sparkCursor];
    sparkCursor = (sparkCursor + 1) % M;
    sp.life = 0.22 + Math.random() * 0.22;
    sp.x = origin.x + (Math.random() - 0.5) * 0.8;
    sp.y = origin.y + 0.2 + Math.random() * 0.5;
    sp.z = origin.z + (Math.random() - 0.5) * 0.8;
    sp.vx = (Math.random() - 0.5 + inwardSign * 0.6) * 18;
    sp.vy = upVec.y * (5 + Math.random() * 14);
    sp.vz = (Math.random() - 0.5) * 18;
  }
}

function updateSparks(dt) {
  const arr = sparkMesh.geometry.attributes.position.array;
  for (let i = 0; i < sparkPool.length; i++) {
    const sp = sparkPool[i];
    const b = i * 6;
    if (sp.life > 0) {
      sp.life -= dt;
      sp.vy -= 24 * dt;
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.z += sp.vz * dt;
      arr[b] = sp.x; arr[b + 1] = sp.y; arr[b + 2] = sp.z;
      arr[b + 3] = sp.x - sp.vx * 0.035; arr[b + 4] = sp.y - sp.vy * 0.035; arr[b + 5] = sp.z - sp.vz * 0.035;
    } else {
      arr[b] = arr[b + 1] = arr[b + 2] = arr[b + 3] = arr[b + 4] = arr[b + 5] = -9999;
    }
  }
  sparkMesh.geometry.attributes.position.needsUpdate = true;
}

/* Soft path-fog / wind gallery: golden dust washing over the ship at speed (replaces cheap speed-lines). */
let softParticleTex = null;
function getSoftParticleTexture() {
  if (softParticleTex) return softParticleTex;
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 1, 32, 32, 30);
  g.addColorStop(0.0, 'rgba(255,248,230,0.95)');
  g.addColorStop(0.25, 'rgba(255,210,160,0.45)');
  g.addColorStop(0.65, 'rgba(220,160,110,0.12)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  softParticleTex = new THREE.CanvasTexture(c);
  softParticleTex.colorSpace = THREE.SRGBColorSpace;
  return softParticleTex;
}

function makeWindCloudTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  for (let i = 0; i < 18; i++) {
    const x = Math.random() * 256;
    const y = 16 + Math.random() * 32;
    const rx = 28 + Math.random() * 50;
    const ry = 8 + Math.random() * 14;
    const grd = ctx.createRadialGradient(x, y, 2, x, y, rx);
    grd.addColorStop(0, `rgba(255,230,190,${0.22 + Math.random() * 0.2})`);
    grd.addColorStop(1, 'rgba(255,200,140,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/** Local-space wing tip anchors (match neon tip bricks on VOLT / ARC). */
function getWingTipAnchors(shipType) {
  const U = LEGO.U, PH = LEGO.PLATE_H;
  if (shipType === 'volt') {
    return [
      { x: -3.2 * U, y: PH * 1.55, z: -1.2 * U },
      { x:  3.2 * U, y: PH * 1.55, z: -1.2 * U },
    ];
  }
  return [
    { x: -4.4 * U, y: PH * 2.05, z: -1.6 * U },
    { x:  4.4 * U, y: PH * 2.05, z: -1.6 * U },
  ];
}

/** World-space mist points: spawn on emitters, then STAY on the path (no ship-roll). */
function makeMistPoints(count, size, color) {
  const pos = new Float32Array(count * 3);
  const life = new Float32Array(count);
  // Park dead particles far away until first spawn
  for (let i = 0; i < count; i++) {
    pos[i * 3] = pos[i * 3 + 1] = pos[i * 3 + 2] = -9999;
    life[i] = 0;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    map: getSoftParticleTexture(),
    color,
    size,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.NormalBlending,
    sizeAttenuation: true,
    fog: true,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  points.renderOrder = 2;
  return { points, pos, life, cursor: 0 };
}

function buildWindGallery(player, shipType) {
  const g = new THREE.Group(); // lives in SCENE (world space) — never parented to ship roll!
  const tips = getWingTipAnchors(shipType || 'volt');
  const team = new THREE.Color(CONFIG.ships.colors[player]);
  const mist = new THREE.Color('#f0d2a8').lerp(team, 0.18);

  const wake = makeMistPoints(CONFIG.render.windCount, CONFIG.render.windSize, mist);
  const tipMist = makeMistPoints(
    CONFIG.render.windTipCount,
    CONFIG.render.windTipSize,
    mist.clone().lerp(new THREE.Color('#ffffff'), 0.25)
  );
  g.add(wake.points);
  g.add(tipMist.points);

  g.userData = {
    wake,
    tipMist,
    tips,
    spawnAcc: 0,
    // scratch emitters filled each frame in world space
    emitWake: new THREE.Vector3(),
    emitTips: [new THREE.Vector3(), new THREE.Vector3()],
  };
  g.visible = false;
  return g;
}

function spawnMistAt(bucket, x, y, z, jitter, lifeMin, lifeSpan) {
  const i = bucket.cursor % bucket.life.length;
  bucket.cursor++;
  bucket.pos[i * 3] = x + (Math.random() - 0.5) * jitter;
  bucket.pos[i * 3 + 1] = y + (Math.random() - 0.5) * jitter * 0.6;
  bucket.pos[i * 3 + 2] = z + (Math.random() - 0.5) * jitter;
  bucket.life[i] = lifeMin + Math.random() * lifeSpan;
}

function updateWindGallery(ship, dt) {
  const wg = ship.windGallery;
  if (!wg || !ship.mesh) return;
  const spd = ship.velocity.length();
  const frac = state.phase === 'racing' ? Math.max(0, Math.min(1.15, (spd - 18) / CONFIG.render.windSpeedRef)) : 0;
  wg.visible = frac > 0.04 && ship.fellAt === 0 && ship.mesh.visible;
  if (!wg.visible) {
    // Hide parked particles while idle
    const { wake, tipMist } = wg.userData;
    wake.points.material.opacity = 0;
    tipMist.points.material.opacity = 0;
    return;
  }

  const { wake, tipMist, tips, emitWake, emitTips } = wg.userData;
  // Emitters follow the VISUAL hull (incl. roll), but each particle freezes in WORLD after spawn
  // so the trail curves with the path instead of tumbling with the ship.
  const origin = ship.mesh.position;
  const q = ship.mesh.quaternion;
  S3.set(1, 0, 0).applyQuaternion(q); // right
  S2.set(0, 1, 0).applyQuaternion(q); // up
  S1.set(0, 0, 1).applyQuaternion(q); // forward

  // Thruster emitter just aft of the hull
  emitWake.copy(origin).addScaledVector(S1, -1.85).addScaledVector(S2, 0.12);
  // Wing-tip emitters in world space
  for (let t = 0; t < 2; t++) {
    const loc = tips[t];
    emitTips[t]
      .copy(origin)
      .addScaledVector(S3, loc.x)
      .addScaledVector(S2, loc.y)
      .addScaledVector(S1, loc.z);
  }

  // Spawn rate scales with speed — leaves a curved path as the ship turns
  wg.userData.spawnAcc += dt * (8 + frac * 28);
  while (wg.userData.spawnAcc >= 1) {
    wg.userData.spawnAcc -= 1;
    spawnMistAt(wake, emitWake.x, emitWake.y, emitWake.z, 0.35, 0.45, 0.55);
    spawnMistAt(tipMist, emitTips[0].x, emitTips[0].y, emitTips[0].z, 0.12, 0.35, 0.5);
    spawnMistAt(tipMist, emitTips[1].x, emitTips[1].y, emitTips[1].z, 0.12, 0.35, 0.5);
  }

  // Age in place (tiny path-aligned drift only — NO orbit/roll with the hull)
  const drift = dt * Math.min(2.5, spd * 0.04);
  const fx = -S1.x * drift, fy = -S1.y * drift, fz = -S1.z * drift;
  for (const bucket of [wake, tipMist]) {
    const attr = bucket.points.geometry.attributes.position;
    for (let i = 0; i < bucket.life.length; i++) {
      if (bucket.life[i] <= 0) continue;
      bucket.life[i] -= dt;
      if (bucket.life[i] <= 0) {
        bucket.pos[i * 3] = bucket.pos[i * 3 + 1] = bucket.pos[i * 3 + 2] = -9999;
        continue;
      }
      // Soft hang in the air along the travelled path
      bucket.pos[i * 3] += fx * 0.15;
      bucket.pos[i * 3 + 1] += fy * 0.15 + dt * 0.08;
      bucket.pos[i * 3 + 2] += fz * 0.15;
    }
    attr.needsUpdate = true;
  }

  wake.points.material.opacity = Math.min(0.42, frac * 0.38);
  wake.points.material.size = CONFIG.render.windSize * (0.9 + frac * 0.25);
  tipMist.points.material.opacity = Math.min(0.5, frac * 0.46);
  tipMist.points.material.size = CONFIG.render.windTipSize * (0.95 + frac * 0.3);
}

/* Single viewport render pass for one camera/ship pair via EffectComposer! */
function renderViewport(player, alpha) {
  if (!cameras[player] || !ships[player]) return;
  const w = window.innerWidth, h = window.innerHeight;
  const solo = isGhostMode();
  const hh = solo ? h : Math.max(2, Math.floor(h / 2));
  const rc = cameras[player], s = ships[player];
  // Interpolate both ships (+ their mirror reflections on the glossy track!) before the first viewport pass
  if (player === 0) {
    for (const sh of ships) {
      if (!sh || !sh.mesh) continue;
      sh.mesh.visible = state.phase !== 'select' && sh.fellAt === 0;
      sh.mesh.position.lerpVectors(sh.prevPos, sh.pos, alpha);
      S1.copy(sh.prevForward).lerp(sh.forward, alpha).normalize();
      S2.copy(sh.prevUp).lerp(sh.up, alpha).normalize();
      S3.crossVectors(S2, S1).normalize();
      S2.crossVectors(S1, S3).normalize();
      M4.makeBasis(S3, S2, S1);
      Q1.setFromRotationMatrix(M4);
      const roll = sh.prevVisualRoll + (sh.visualRoll - sh.prevVisualRoll) * alpha;
      Q2.setFromAxisAngle(S1, roll);
      sh.mesh.quaternion.multiplyQuaternions(Q2, Q1);

      // Update glossy wet-asphalt reflection decal strictly ON the road surface (100% Z-buffer occluded by ships & walls!)
      if (sh.reflMesh) {
        const f = trackTable[sh.trackIdx];
        const overRoad = !inGap(sh.trackIdx) && Math.abs(sh.lane) <= CONFIG.track.roadHalfWidth - 0.5;
        const hAbove = S4.copy(sh.mesh.position).sub(f.pos).dot(f.up);
        const fade = overRoad && sh.mesh.visible && hAbove > 0.05 && hAbove < 5.0
          ? Math.max(0, Math.min(1, 1.15 - hAbove / 4.4))
          : 0;
        sh.reflMesh.visible = fade > 0.02;
        if (sh.reflMesh.visible) {
          // Place flat on the local road frame directly under the ship (+0.03m above road mesh), rotated to match ship heading!
          sh.reflMesh.position.copy(sh.mesh.position).addScaledVector(f.up, -hAbove + 0.03);
          S5.copy(S1).projectOnPlane(f.up).normalize(); // Y = ship forward projected onto road plane
          S4.crossVectors(S5, f.up).normalize();        // X = Y × Z -> right-handed det = +1! (Wait: (Y × Z) × Y = Z! Wait: X × Y = (Y × Z) × Y = +Z! YES!)
          M4.makeBasis(S4, S5, f.up);
          sh.reflMesh.quaternion.setFromRotationMatrix(M4);
          sh.reflMesh.material.opacity = CONFIG.render.shipReflectionOpacity * fade;
        }
      }
    }
    // Advect path-fog wind gallery once per frame (both ships)
    const dtSec = Math.min(0.05, (performance.now() - (state._windLastMs || performance.now())) / 1000);
    state._windLastMs = performance.now();
    for (const sh of ships) updateWindGallery(sh, dtSec > 0 ? dtSec : 1 / 60);
  }

  // Chroma still scales with speed (no more low-quality camera speed-lines)
  const spdFrac = state.phase === 'racing' ? Math.max(0, (s.velocity.length() - 36) / 36) : 0;

  const expectedAspect = w / hh;
  if (Math.abs(rc.cam.aspect - expectedAspect) > 1e-4) {
    rc.cam.aspect = expectedAspect;
    rc.cam.updateProjectionMatrix();
  }

  const baseY = solo ? 0 : (player === 0 ? hh : 0);
  const targetRT = mainComposer ? mainComposer.writeBuffer : null;
  renderer.setRenderTarget(targetRT);
  renderer.setScissorTest(true);
  renderer.setViewport(0, baseY, w, hh);
  renderer.setScissor(0, baseY, w, hh);
  const prevTM = renderer.toneMapping;
  const prevCS = renderer.outputColorSpace;
  if (targetRT) {
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  }
  // Lock sky dome to this camera so the golden-hour sun never parallax-clips at track edges
  skyDome.position.copy(rc.cam.position);
  renderer.render(scene, rc.cam);
  if (targetRT) {
    renderer.toneMapping = prevTM;
    renderer.outputColorSpace = prevCS;
  }
  if (mainFxaaChroma) {
    const cVal = Math.min(CONFIG.render.chromaMax, spdFrac * CONFIG.render.chromaMax);
    if (player === 0) mainFxaaChroma.uniforms.chromaTop.value = cVal;
    else mainFxaaChroma.uniforms.chromaBot.value = cVal;
  }
}

/* ---- HUD panels + Phase 5 Overlays (Ship Select, Countdown, Finish) ----- */
let dividerEl = null, selectEl = null, bannerEl = null, finishEl = null;

function fmtTime(ms) {
  if (!ms || ms <= 0 || !Number.isFinite(ms)) return '--:--.--';
  const totalSec = ms / 1000;
  const mins = Math.floor(totalSec / 60);
  const secs = Math.floor(totalSec % 60);
  const cs = Math.floor((ms % 1000) / 10);
  return `${mins}:${String(secs).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}

function makeDivider() {

}
